<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Renault Test Drive Demo</title>
<meta name="description" content="Renault Duster test drive, end to end: booking, validation, dealer fulfilment, confirmation and AI calling. A FreeStand demo.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>/* FreeStand UI (the HUL CDP v2 palette) for the Renault test-drive demo. */
:root {
  --navy: #0d2a69;
  --primary: #0a3578;
  --blue: #1f4fd1;
  --orange: #ff6b00;
  --orange-tint: #fff1e6;
  --ink: #0f172a;
  --sub: #5b6b82;
  --muted: #94a3b8;
  --line: #e2e8f0;
  --bg: #edf1f8;
  --tint: #eaf0fb;
  --soft: #f5f7fb;
  --green: #16a34a;
  --green-tint: #e8f6ee;
  --amber: #b45309;
  --amber-tint: #fff6e0;
  --renault: #17181c;
  --ry: #efdf00;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font-family: inherit; cursor: pointer; }

/* ── shell: rail | main ────────────────────────────── */
.app { height: 100vh; display: grid; grid-template-columns: 252px 1fr; gap: 16px; padding: 14px 16px 14px 14px; }
.rail { display: flex; flex-direction: column; min-height: 0; }
.rail .logo { padding: 6px 8px 14px; }
.rail .logo img { height: 21px; display: block; }
.rail .logo div { font-size: 9.5px; font-weight: 700; letter-spacing: 1.8px; color: var(--muted); margin-top: 6px; text-transform: uppercase; }
.chap { border-radius: 10px; padding: 10px 10px; display: grid; grid-template-columns: 28px 1fr; gap: 10px; cursor: pointer; transition: background .2s; margin-bottom: 4px; }
.chap:hover { background: rgba(255,255,255,.6); }
.chap .n { width: 28px; height: 28px; border-radius: 8px; border: 1.5px solid #c7d2e6; color: var(--primary); display: grid; place-items: center; font-size: 11px; font-weight: 800; background: #fff; transition: all .25s; }
.chap .t { font-size: 13px; font-weight: 700; color: var(--primary); line-height: 1.25; }
.chap .s { font-size: 11px; color: var(--sub); margin-top: 2px; line-height: 1.35; }
.chap.on { background: #fff; box-shadow: 0 4px 14px rgba(13,42,105,.08); }
.chap.on .n { background: var(--orange); border-color: var(--orange); color: #fff; }
.chap.done .n { background: var(--primary); border-color: var(--primary); color: #fff; }
.steps { grid-column: 1 / -1; margin: 6px 0 2px 4px; display: flex; flex-direction: column; gap: 1px; }
.steps div { display: flex; align-items: center; gap: 9px; font-size: 11.5px; color: var(--sub); padding: 5px 8px; border-radius: 6px; cursor: pointer; }
.steps div i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid #b6c3db; flex: none; }
.steps div.past i { background: var(--primary); border-color: var(--primary); }
.steps div.cur { background: var(--tint); color: var(--primary); font-weight: 700; }
.steps div.cur i { background: var(--orange); border-color: var(--orange); box-shadow: 0 0 0 3px rgba(255,107,0,.18); }
.steps div:hover { color: var(--primary); }
.rail .foot { margin-top: auto; }
.counter { background: #fff; border-radius: 10px; padding: 10px 12px; font-size: 11px; color: var(--sub); line-height: 1.45; box-shadow: 0 2px 8px rgba(13,42,105,.05); }
.counter b { color: var(--ink); font-size: 12px; }
.credit { font-size: 9.5px; color: var(--muted); margin: 8px 4px 0; line-height: 1.4; }
.credit a { color: inherit; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding: 4px 4px 12px; min-height: 74px; }
.head .eb { font-size: 10.5px; font-weight: 800; letter-spacing: 1.8px; color: var(--sub); text-transform: uppercase; }
.head .eb b { color: var(--orange); }
.head h1 { font-size: 25px; font-weight: 800; color: var(--primary); letter-spacing: -.3px; margin-top: 4px; line-height: 1.15; }
.head p { font-size: 13.5px; color: var(--sub); margin-top: 4px; line-height: 1.45; max-width: 900px; }
.head .hx { animation: fadeInUp .45s both; }
.brandlock { display: flex; align-items: center; gap: 10px; flex: none; padding-bottom: 4px; }
.brandlock .rn { display: flex; align-items: center; gap: 8px; font-weight: 800; letter-spacing: 3px; font-size: 13px; color: var(--renault); }
.brandlock .rn span { width: 30px; height: 30px; border-radius: 7px; background: var(--renault); display: grid; place-items: center; }
.brandlock .x { color: var(--muted); font-size: 12px; }
.stage { flex: 1; min-height: 0; position: relative; }
.frame { position: absolute; border-radius: 16px; overflow: hidden; background: #fff; box-shadow: 0 10px 30px rgba(13,42,105,.1); }
.canvas { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; transform-origin: 0 0; }
.slide { position: absolute; inset: 0; }
.slide.enter { animation: slideIn .45s cubic-bezier(.2,.7,.2,1) both; }
.slide.leave { animation: slideOut .22s ease-in both; }
.banner { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); z-index: 20; background: var(--primary); color: #fff; border-radius: 999px; padding: 9px 18px 9px 10px; display: flex; align-items: center; gap: 12px; font-size: 13.5px; box-shadow: 0 10px 30px rgba(13,42,105,.3); animation: banner 3.2s ease both; white-space: nowrap; }
.banner b { background: var(--orange); border-radius: 999px; padding: 4px 10px; font-size: 11px; letter-spacing: 1.2px; }

.bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding-top: 12px; }
.bar .prev { justify-self: start; background: var(--primary); color: #fff; border: none; border-radius: 8px; padding: 11px 20px; font-size: 13px; font-weight: 600; }
.bar .prev:disabled { background: #c8d3e6; cursor: default; }
.bar .nextw { justify-self: end; display: flex; align-items: center; gap: 12px; }
.bar .upnext { font-size: 12px; color: var(--sub); text-align: right; line-height: 1.3; }
.bar .upnext b { display: block; color: var(--primary); font-size: 13px; }
.bar .next { background: var(--blue); color: #fff; border: none; border-radius: 8px; padding: 11px 22px; font-size: 13.5px; font-weight: 700; box-shadow: 0 6px 16px rgba(31,79,209,.28); }
.bar .next:disabled { background: #c8d3e6; box-shadow: none; cursor: default; }
.bar .next.pulse { animation: nudge 1.6s ease-in-out 3s infinite; }
.chips-bar { display: flex; gap: 8px; }
.chips-bar button { border: none; background: #fff; color: var(--primary); border-radius: 999px; padding: 7px 14px 7px 7px; font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; box-shadow: 0 1px 3px rgba(13,42,105,.06); }
.chips-bar button i { font-style: normal; width: 22px; height: 22px; border-radius: 50%; background: var(--tint); display: grid; place-items: center; font-size: 10.5px; font-weight: 800; }
.chips-bar button.on { background: var(--primary); color: #fff; }
.chips-bar button.on i { background: var(--orange); color: #fff; }
.chips-bar button.done i { background: var(--primary); color: #fff; }

/* ── motion ────────────────────────────────────────── */
@keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes slideIn { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes slideOut { to { opacity: 0; transform: translateX(-20px); } }
@keyframes pop { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
@keyframes blink { 50% { opacity: .25; } }
@keyframes dash { to { stroke-dashoffset: -32; } }
@keyframes dash2 { to { stroke-dashoffset: 0; } }
@keyframes pulse { 0% { transform: scale(.7); opacity: .6; } 100% { transform: scale(1.6); opacity: 0; } }
@keyframes wbar { 50% { transform: scaleY(.35); } }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes dots { 0%, 80%, 100% { transform: translateY(0); opacity: .35; } 40% { transform: translateY(-4px); opacity: 1; } }
@keyframes banner { 0% { opacity: 0; transform: translate(-50%, -12px); } 12%, 82% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -8px); } }
@keyframes nudge { 0%, 100% { transform: none; } 50% { transform: translateX(4px); } }
@keyframes tap { 0% { transform: scale(1); } 40% { transform: scale(.96); background: #d6ecfa; } 100% { transform: scale(1); } }
@keyframes shimmer { from { background-position: -300px 0; } to { background-position: 300px 0; } }
.in { animation: fadeInUp .45s both; }
.sv-pop { animation: pop .45s both; transform-box: fill-box; transform-origin: center; }
.blink { animation: blink 1.3s infinite; }
.flow { animation: dash 1.2s linear infinite; }
.pulse { animation: pulse 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
.wbar { animation: wbar .9s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.spin { animation: spin 1s linear infinite; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition: none !important; } }

/* ── scene ─────────────────────────────────────────── */
.scene { position: absolute; inset: 0; background: #eaf0fb; }
.loc { position: absolute; left: 0; right: 0; top: 0; height: 40px; background: var(--navy); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 700; letter-spacing: .3em; z-index: 2; }
.loc i { font-style: normal; margin: 0 .7em; opacity: .55; }
.scene .art { position: absolute; left: 0; right: 0; top: 40px; bottom: 0; }
.scene-svg { width: 100%; height: 100%; display: block; }
.illus { position: absolute; right: 14px; bottom: 12px; font-size: 9.5px; font-weight: 800; letter-spacing: 1.4px; color: var(--primary); background: rgba(255,255,255,.85); padding: 4px 8px; border-radius: 4px; }

/* ── phone + panel ─────────────────────────────────── */
.split { position: absolute; inset: 0; background: #fff; }
.phone { position: absolute; left: 34px; top: 12px; width: 368px; height: 776px; border-radius: 36px; overflow: hidden; background: #fff; box-shadow: 0 14px 40px rgba(13,42,105,.22), 0 0 0 7px #10131a; display: flex; flex-direction: column; }
.phone .status { height: 30px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 11px; font-weight: 700; }
.phone .status i { font-style: normal; font-weight: 600; font-size: 10px; opacity: .85; }
.panel { position: absolute; left: 440px; top: 12px; width: 812px; height: 776px; border-radius: 14px; border: 2px solid var(--primary); background: #fff; overflow: hidden; display: flex; flex-direction: column; }
.panel.show { animation: fadeInUp .4s both; }
.ph { height: 70px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 22px; border-bottom: 1px solid var(--line); }
.ph .ic { width: 40px; height: 40px; border-radius: 50%; background: var(--tint); border: 1.5px solid var(--primary); display: grid; place-items: center; font-size: 17px; }
.ph .tt { font-size: 19px; font-weight: 700; color: var(--ink); }
.ph .ss { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.ph .st { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 10.5px; font-weight: 700; letter-spacing: 1px; color: var(--green); }
.ph .st i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: blink 1.4s infinite; }
.pb { flex: 1; padding: 20px 26px; overflow: hidden; }
.waiting { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--sub); font-size: 13.5px; }
.waiting .sp { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--tint); border-top-color: var(--orange); animation: spin .9s linear infinite; }
.skel { width: 70%; height: 12px; border-radius: 6px; background: linear-gradient(90deg, #eef2f8 0, #f7f9fc 50%, #eef2f8 100%); background-size: 600px 12px; animation: shimmer 1.4s linear infinite; }
.sec { font-size: 10.5px; font-weight: 800; letter-spacing: 1.6px; color: var(--primary); text-transform: uppercase; margin: 0 0 9px; }
.sec .r { float: right; color: var(--muted); font-weight: 700; letter-spacing: 1px; }

.chk { display: flex; align-items: center; gap: 12px; padding: 9px 13px; border-radius: 8px; margin-bottom: 7px; background: var(--green-tint); border: 1px solid #b7e2c6; }
.chk .d { width: 24px; height: 24px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 800; flex: none; }
.chk .t { font-size: 13px; font-weight: 700; }
.chk .s { font-size: 11px; color: var(--sub); margin-top: 1px; }
.chk .v { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--green); white-space: nowrap; font-family: ui-monospace, Menlo, monospace; }
.chk.wait { background: var(--amber-tint); border-color: #f1dca4; }
.chk.wait .d { background: #d79b00; }
.chk.wait .v { color: var(--amber); }
.chk.info { background: var(--tint); border-color: #cfdcf0; }
.chk.info .d { background: var(--blue); }
.chk.info .v { color: var(--primary); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip2 { font-size: 11.5px; font-weight: 600; padding: 5px 10px; border-radius: 5px; background: var(--tint); color: var(--primary); }
.chip2.red, .chip2.orange { background: var(--orange-tint); color: #b34700; }
.chip2.green { background: var(--green-tint); color: #11622f; }
.chip2.amber { background: #fff1d1; color: #7a4a00; }
.chip2.dark { background: var(--primary); color: #fff; }
.chip2.new { animation: pop .4s .3s both; box-shadow: 0 0 0 2px var(--orange) inset; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; background: #fff; }
.kv { display: grid; grid-template-columns: 120px 1fr; row-gap: 9px; column-gap: 12px; font-size: 13px; }
.kv .k { color: var(--muted); }
.kv .v { font-weight: 650; }
.mono { font-family: ui-monospace, Menlo, monospace; }
.bar2 { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar2 i { display: block; height: 100%; background: var(--green); border-radius: 3px; transform-origin: left; animation: grow .9s .2s both; }
.note { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: 10px; background: var(--soft); border: 1px solid var(--line); font-size: 12px; line-height: 1.55; color: #3b4352; }
.note .i { font-size: 18px; line-height: 1.2; }
.note b { color: var(--primary); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.big { font-size: 30px; font-weight: 800; letter-spacing: -.5px; color: var(--ink); }
.lbl { font-size: 11px; color: var(--muted); }
.av { border-radius: 12px; overflow: hidden; border: 2px solid #d8e0ee; background: var(--tint); flex: none; }
.av svg { width: 100%; height: 100%; display: block; }

/* ── WhatsApp ─────────────────────────────────────── */
.wa .status { background: #075e54; color: #fff; }
.wa .hd { height: 56px; flex: none; background: #075e54; color: #fff; display: flex; align-items: center; gap: 10px; padding: 0 12px; }
.wa .hd .lg { width: 36px; height: 36px; border-radius: 50%; background: var(--renault); display: grid; place-items: center; }
.wa .hd .n { font-size: 14.5px; font-weight: 700; display: flex; align-items: center; gap: 4px; }
.wa .hd .n img { width: 14px; height: 14px; }
.wa .hd .o { font-size: 10.5px; opacity: .8; }
.wa .hd .ac { margin-left: auto; display: flex; gap: 16px; font-size: 15px; opacity: .9; }
.wa .body { flex: 1; overflow-y: auto; padding: 10px 10px 6px; background-color: #ece5dd; scrollbar-width: none; }
.wa .body::-webkit-scrollbar { display: none; }
.wa .foot { height: 52px; flex: none; background: #f0f0f0; display: flex; align-items: center; gap: 8px; padding: 0 10px; }
.wa .foot .in2 { flex: 1; height: 34px; border-radius: 17px; background: #fff; display: flex; align-items: center; padding: 0 14px; font-size: 12px; color: #9aa0a6; }
.wa .foot .mic { width: 36px; height: 36px; border-radius: 50%; background: #075e54; display: grid; place-items: center; color: #fff; font-size: 14px; }
.div { text-align: center; margin: 10px 0 8px; }
.div span { font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #54656f; background: rgba(255,255,255,.88); padding: 4px 10px; border-radius: 7px; }
.sysm { text-align: center; margin-bottom: 10px; }
.sysm span { display: inline-block; font-size: 9.5px; color: #7a5b00; background: #fff3c4; padding: 5px 10px; border-radius: 7px; line-height: 1.4; }
.msg { display: flex; margin-bottom: 7px; }
.msg.u { justify-content: flex-end; }
.msg .b { max-width: 84%; background: #fff; border-radius: 0 10px 10px 10px; padding: 8px 11px 6px; font-size: 12.5px; line-height: 1.48; white-space: pre-wrap; box-shadow: 0 1px 1px rgba(0,0,0,.08); }
.msg.u .b { background: #d9fdd3; border-radius: 10px 0 10px 10px; }
.msg .tm { display: block; text-align: right; font-size: 9px; color: #8a9499; margin-top: 2px; }
.msg.u .tm { color: #5a9a6a; }
.msg.live { animation: fadeInUp .32s both; }
.typing .b { padding: 11px 14px; }
.typing .b span { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #8a9499; margin: 0 2px; animation: dots 1.1s infinite; }
.typing .b span:nth-child(2) { animation-delay: .15s; }
.typing .b span:nth-child(3) { animation-delay: .3s; }
.typing.u .b { background: #d9fdd3; }
.opts { display: flex; flex-direction: column; gap: 4px; margin: 6px -11px -6px; border-top: 1px solid #eef0f1; }
.opts div { text-align: center; font-size: 12px; font-weight: 600; color: #027eb5; padding: 7px 0; border-bottom: 1px solid #eef0f1; transition: background .2s; }
.opts div:last-child { border-bottom: none; }
.opts div.pk { background: #eaf6fc; }
.opts div.tap { animation: tap .45s both; }
.wacard { margin: -2px -5px 6px; border-radius: 8px; overflow: hidden; border: 1px solid #eceff1; }
.dlimg { width: 210px; display: block; }
.locimg { width: 220px; height: 110px; border-radius: 8px; overflow: hidden; }

/* ── Renault website ───────────────────────────────── */
.br .status { background: #fff; color: #111; }
.br .url { height: 42px; flex: none; display: flex; align-items: center; padding: 0 12px; background: #fff; border-bottom: 1px solid #eceef1; }
.br .url div { flex: 1; height: 30px; border-radius: 15px; background: #f1f3f4; display: flex; align-items: center; gap: 6px; padding: 0 12px; font-size: 11.5px; color: #3c4043; }
.site-hd { height: 50px; flex: none; background: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #eceef1; }
.site-hd .w { display: flex; align-items: center; gap: 8px; font-weight: 800; letter-spacing: 3px; font-size: 14px; color: #111; }
.site { flex: 1; overflow: hidden; position: relative; background: #fff; }
.hero { background: linear-gradient(160deg, #17181c 0%, #3b2a12 100%); color: #fff; padding: 14px 18px 4px; }
.hero .k { font-size: 10px; letter-spacing: 2px; color: var(--ry); font-weight: 700; }
.hero .h { font-size: 24px; font-weight: 900; letter-spacing: 1px; margin-top: 2px; }
.hero .s { font-size: 11px; color: #cbd5e1; }
.hero svg { width: 100%; height: 112px; display: block; margin-top: 4px; }
.form { padding: 10px 16px; }
.fl { font-size: 10.5px; font-weight: 700; color: #4b5563; letter-spacing: .4px; margin: 9px 0 5px; text-transform: uppercase; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg div { flex: 1; text-align: center; font-size: 11.5px; font-weight: 600; padding: 8px 4px; border-radius: 6px; border: 1.5px solid #d6dae0; color: #374151; white-space: nowrap; }
.seg div.on { border-color: #111; background: #111; color: #fff; }
.seg div small { display: block; font-size: 9.5px; font-weight: 500; opacity: .7; }
.inp { height: 38px; border: 1.5px solid #d6dae0; border-radius: 6px; display: flex; align-items: center; padding: 0 12px; font-size: 13px; color: #111; gap: 8px; }
.inp.ok { border-color: var(--green); }
.inp .pre { color: #6b7280; }
.inp .tick { margin-left: auto; color: var(--green); font-weight: 800; font-size: 12px; }
.typed { display: inline-block; overflow: hidden; white-space: nowrap; vertical-align: bottom; width: 0; animation: typeIn var(--dur, 1s) steps(var(--n, 12)) var(--d, 0s) forwards; }
@keyframes typeIn { to { width: var(--w, 10ch); } }
.cons { display: flex; gap: 8px; font-size: 10.5px; color: #4b5563; line-height: 1.4; margin-top: 10px; }
.cons .bx { width: 16px; height: 16px; border-radius: 3px; background: #111; color: #fff; font-size: 11px; display: grid; place-items: center; flex: none; }
.cta { margin-top: 12px; height: 44px; border-radius: 6px; background: var(--ry); color: #111; font-weight: 800; font-size: 14px; display: grid; place-items: center; letter-spacing: .4px; }
.cta.press { animation: tap .5s both; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 18px 18px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,.25); padding: 18px 18px 22px; animation: fadeInUp .45s both; }
.dim { position: absolute; inset: 0; background: rgba(10,12,16,.45); animation: fadeInUp .3s both; }
.otp { display: flex; gap: 8px; margin: 14px 0 8px; }
.otp div { flex: 1; height: 46px; border: 1.5px solid #d6dae0; border-radius: 8px; display: grid; place-items: center; font-size: 20px; font-weight: 700; }
.otp div.f { border-color: #111; }

/* ── dealer app ────────────────────────────────────── */
.dl .status { background: var(--navy); color: #fff; }
.dl .hd { flex: none; background: var(--navy); color: #fff; padding: 6px 16px 14px; }
.dl .hd .a { display: flex; align-items: center; gap: 10px; }
.dl .hd .a img { width: 26px; height: 26px; border-radius: 6px; background: #fff; padding: 3px; }
.dl .hd .n { font-size: 14px; font-weight: 700; }
.dl .hd .o { font-size: 10.5px; color: #c7d6f5; }
.dl .bd { flex: 1; background: var(--soft); padding: 12px; overflow: hidden; }
.lead { background: #fff; border-radius: 12px; border: 2px solid var(--orange); overflow: hidden; animation: pop .45s both; }
.lead .tp { background: var(--orange); color: #fff; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 800; letter-spacing: 1px; }
.lead .in3 { padding: 12px; }
.grade { width: 44px; height: 44px; border-radius: 10px; background: var(--green); color: #fff; display: grid; place-items: center; font-size: 22px; font-weight: 900; flex: none; }
.btn { height: 44px; border-radius: 8px; display: grid; place-items: center; font-weight: 800; font-size: 13.5px; transition: background .3s; }
.btn.or { background: var(--orange); color: #fff; }
.btn.dark { background: var(--primary); color: #fff; }
.btn.ghost { border: 1.5px solid #cfd4db; color: #374151; }
.btn.green { background: var(--green); color: #fff; }
.opt { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; border: 1.5px solid #e1e4e8; background: #fff; margin-bottom: 7px; }
.opt.on { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary) inset; }
.opt .rd { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #c3c8cf; flex: none; }
.opt.on .rd { border: 5px solid var(--primary); }

/* ── call screen ───────────────────────────────────── */
.call { background: linear-gradient(180deg, #0d2a69, #0a1a3f); color: #fff; }
.call .status { color: #fff; }

/* ── full-canvas pages ─────────────────────────────── */
.full { position: absolute; inset: 0; background: #fff; }
.dash { position: absolute; inset: 0; display: grid; grid-template-columns: 200px 1fr; }
.side { background: var(--navy); color: #c7d6f5; padding: 18px 0; display: flex; flex-direction: column; }
.side .lg { padding: 0 18px 18px; border-bottom: 1px solid rgba(255,255,255,.1); }
.side .lg img { height: 18px; filter: brightness(0) invert(1); }
.side a { display: flex; align-items: center; gap: 10px; padding: 10px 18px; font-size: 12.5px; color: inherit; text-decoration: none; }
.side a.on { background: rgba(255,255,255,.1); color: #fff; box-shadow: inset 3px 0 0 var(--orange); }
.mainp { padding: 20px 26px; overflow: hidden; background: var(--soft); }
.kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.kpi { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.kpi .v { font-size: 22px; font-weight: 800; color: var(--ink); }
.kpi .l { font-size: 11px; color: var(--sub); margin-top: 2px; }
.kpi .d { font-size: 10.5px; color: var(--green); font-weight: 700; margin-top: 4px; }
.funnel .row { display: grid; grid-template-columns: 170px 1fr 110px; align-items: center; gap: 12px; margin-bottom: 8px; font-size: 12px; }
.funnel .row .b { height: 22px; background: #eef1f6; border-radius: 0 4px 4px 0; position: relative; }
.funnel .row .b i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--primary); border-radius: 0 4px 4px 0; transform-origin: left; animation: grow .9s both; }
.funnel .row .b i.hi { background: var(--orange); }
.funnel .row .n { font-weight: 700; color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
.funnel .row .n small { color: var(--muted); font-weight: 600; margin-left: 4px; }
table.t { width: 100%; border-collapse: collapse; font-size: 12px; }
table.t th { text-align: left; font-size: 10px; letter-spacing: 1px; color: var(--muted); font-weight: 700; text-transform: uppercase; padding: 0 8px 8px; border-bottom: 1px solid var(--line); }
table.t td { padding: 8px; border-bottom: 1px solid #f0f1f3; font-variant-numeric: tabular-nums; }
table.t td.r, table.t th.r { text-align: right; }
table.t tr:hover td { background: #fafbfc; }
#tip { position: fixed; z-index: 99; pointer-events: none; background: var(--navy); color: #fff; font-size: 11.5px; padding: 6px 9px; border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.25); opacity: 0; transition: opacity .12s; max-width: 260px; }

/* narrow screens: stack the rail on top */
@media (max-width: 900px) {
  body { overflow: auto; }
  .app { grid-template-columns: 1fr; height: auto; min-height: 100vh; }
  .rail .chap:not(.on), .rail .foot { display: none; }
  .stage { height: 62vw; flex: none; }
  .bar { grid-template-columns: auto 1fr auto; }
  .chips-bar { display: none; }
  .brandlock { display: none; }
}
</style>
</head>

<script>/* Renault Duster test-drive demo: booking → validation → dealer fulfilment → confirmation & AI calling.
   Vanilla JS in the FreeStand UI shell. Scenes, avatars, the car and the Desi Log drawings are
   pre-rendered at build time into window.__DATA (and one shared SVG sprite). */
(function () {
  const D = window.__DATA;
  const ORANGE = '#ff6b00';
  const NAVY = '#0a3578';
  const YELLOW = '#efdf00';
  const $ = (s) => document.querySelector(s);
  let cur = document; // the slide on stage: live updates look up elements only inside it
  const $$ = (s) => cur.querySelector(s);

  // ───────────────────────────── helpers ─────────────────────────────
  const dia = (size = 16, col = '#fff') => {
    const a = size / 2, b = size * 0.34, t = Math.max(1.2, size * 0.09);
    const r = (k) => `<path d="M0 ${-a * k}L${b * k} 0L0 ${a * k}L${-b * k} 0Z" fill="none" stroke="${col}" stroke-width="${t}"/>`;
    return `<svg width="${size}" height="${size}" viewBox="${-a} ${-a} ${size} ${size}">${r(0.92)}${r(0.52)}</svg>`;
  };
  const ph = (icon, title, sub, st = 'LIVE', col) =>
    `<div class="ph"><div class="ic">${icon}</div><div><div class="tt">${title}</div><div class="ss">${sub}</div></div><div class="st" style="${col ? `color:${col}` : ''}"><i style="${col ? `background:${col}` : ''}"></i>${st}</div></div>`;
  const chk = (t, s, v = '', cls = '', d = 0) =>
    `<div class="chk ${cls} in" style="animation-delay:${d}s"><div class="d">${cls === 'wait' ? '…' : cls === 'info' ? 'i' : '✓'}</div><div><div class="t">${t}</div>${s ? `<div class="s">${s}</div>` : ''}</div>${v ? `<div class="v">${v}</div>` : ''}</div>`;
  const chips = (arr) => `<div class="chips">${arr.map((c) => (typeof c === 'string' ? `<span class="chip2">${c}</span>` : `<span class="chip2 ${c[1]}">${c[0]}</span>`)).join('')}</div>`;
  const note = (i, html) => `<div class="note"><div class="i">${i}</div><div>${html}</div></div>`;
  const av = (k, sz) => `<div class="av" style="width:${sz}px;height:${sz}px">${D.avatars[k]}</div>`;
  const strip = (h) => String(h).replace(/<[^>]+>/g, '');

  // ───────────────────────────── the persona and the facts ─────────────────────────────
  const P = {
    name: 'Shubham Kohli', phone: '+91 98374 92834', masked: '98XXX XX834', email: 'shubham.kohli@gmail.com',
    addr: 'C-42, 2nd Floor, Vishal Enclave, Rajouri Garden, New Delhi 110027', lead: 'LD-26-10419',

        if (ev) ev.insertAdjacentHTML('beforeend', `<div class="in" style="display:flex;gap:12px;font-size:12px;padding:5px 0"><span class="mono" style="color:#94a3b8;width:66px">9:17:52</span><span><b>Kirti Nagar accepted · lead locked</b></span></div>`);
        const race = $$('#race');
        if (race) race.textContent = 'WON IN 1:48';
      });
      later(4300, () => {
        ['#r2', '#r3'].forEach((id) => { const r = $$(id); if (r) { r.style.opacity = '.6'; r.querySelector('.chip2').className = 'chip2'; r.querySelector('.chip2').textContent = 'WITHDRAWN'; } });
        const ev = $$('#evlog');
        if (ev) ev.insertAdjacentHTML('beforeend', `<div class="in" style="display:flex;gap:12px;font-size:12px;padding:5px 0"><span class="mono" style="color:#94a3b8;width:66px">9:17:53</span><span>Offer withdrawn from 2 dealers · full profile unlocked</span></div>`);
        const st = $$('#panel .ph .st');
        if (st) st.innerHTML = '<i></i>LOCKED', (st.style.color = '#16a34a');
        nudge();
      });
    }
    if (s.live === 'call') {
      let t = 0;
      const g = gen;
      const tick = setInterval(() => {
        if (g !== gen) return clearInterval(tick);
        t = Math.min(t + 1, 52);
        const el = $$('#calltime');
        if (el) el.textContent = `00:${String(t).padStart(2, '0')}`;
      }, 190);
      later(9600, nudge);
    }
    if (!s.wa && !s.live) later(s.panelDelay ? s.panelDelay + 1500 : 2600, nudge);
  }
  function nudge() { $('#next')?.classList.add('pulse'); }

  // ───────────────────────────── render ─────────────────────────────
  const canvas = $('#canvas');
  const KEY = 'renault-td-step';
  let idx = 0;
  try { const h = parseInt((location.hash.match(/\d+/) || [])[0], 10); idx = h ? h - 1 : parseInt(localStorage.getItem(KEY) || '0', 10) || 0; } catch (e) {}
  idx = Math.min(Math.max(0, idx), STEPS.length - 1);

  function slideHTML(s) {
    if (s.render) return s.render();
    if (s.kind === 'scene') return `<div class="scene"><div class="loc">${s.loc.split(' · ').join('<i>·</i>')}</div><div class="art">${D.scenes[s.name]}</div><div class="illus">ILLUSTRATIVE</div></div>`;
    const phone = s.wa ? waPhone(s.wa[0]) : s.split();
    const panel = s.wait ? waitPanel(...s.wait) : '<div class="panel" id="panel"></div>';
    return `<div class="split">${phone}${panel}</div>`;
  }

  function draw(prev) {
    gen++;
    const s = STEPS[idx];
    // slide transition
    canvas.querySelectorAll('.slide:not(.leave)').forEach((old) => { old.classList.add('leave'); setTimeout(() => old.remove(), 220); });
    const el = document.createElement('div');
    el.className = 'slide enter';
    el.innerHTML = slideHTML(s);
    canvas.appendChild(el);
    cur = el;
    const wb = el.querySelector('#wabody');
    if (wb) wb.scrollTop = wb.scrollHeight;
    // chapter banner when a new chapter starts going forward
    if (prev !== undefined && prev < idx && STEPS[prev].c !== s.c && CH[s.c].banner) {
      const b = document.createElement('div');
      b.className = 'banner';
      b.innerHTML = `<b>${CH[s.c].n} · ${CH[s.c].t.toUpperCase()}</b>${CH[s.c].banner}`;
      $('#stage').appendChild(b);
      setTimeout(() => b.remove(), 3300);
    }
    // head
    $('#head').innerHTML = `<div class="hx"><div class="eb"><b>${CH[s.c].n}</b> · ${CH[s.c].t} · ${s.eb}</div><h1>${s.h}</h1><p>${s.p}</p></div>`;
    renderRail();
    // bar
    $('#prev').disabled = idx === 0;
    const nx = $('#next');
    nx.disabled = idx === STEPS.length - 1;
    nx.classList.remove('pulse');
    nx.textContent = idx === 0 ? 'Start →' : 'Next →';
    $('#upnext').innerHTML = idx < STEPS.length - 1 ? `Up next<b>${STEPS[idx + 1].label}</b>` : '';
    document.querySelectorAll('.chips-bar button').forEach((b) => { const k = +b.dataset.c; b.className = k === s.c ? 'on' : k < s.c ? 'done' : ''; });
    $('#counter').innerHTML = `<b>${idx + 1} / ${STEPS.length}</b> · ${CH[s.c].t}<br>${s.label}`;
    try { localStorage.setItem(KEY, String(idx)); history.replaceState(null, '', `#${idx + 1}`); } catch (e) {}
    const sb = el.querySelector('#startbtn');
    if (sb) sb.addEventListener('click', () => go(idx + 1));
    runLive(s);
  }

  function renderRail() {
    const s = STEPS[idx];
    $('#chapters').innerHTML = CH.map((c, k) => {
      const first = STEPS.findIndex((x) => x.c === k);
      const list = k === s.c && STEPS.filter((x) => x.c === k).length > 1
        ? `<div class="steps">${STEPS.map((x, i) => (x.c === k ? `<div data-i="${i}" class="${i === idx ? 'cur' : i < idx ? 'past' : ''}"><i></i>${x.label}</div>` : '')).join('')}</div>`
        : '';
      return `<div class="chap ${k === s.c ? 'on' : k < s.c ? 'done' : ''}" data-i="${first}"><div class="n">${k < s.c ? '✓' : c.n}</div><div><div class="t">${c.t}</div><div class="s">${c.s}</div></div>${list}</div>`;
    }).join('');
    $('#chapters').querySelectorAll('[data-i]').forEach((e) => e.addEventListener('click', (ev) => { ev.stopPropagation(); go(+e.dataset.i); }));
  }

  function go(i) { const n = Math.min(Math.max(0, i), STEPS.length - 1); if (n === idx) return; const p = idx; idx = n; draw(p); }

  $('#chipsbar').innerHTML = CH.slice(1, 5).map((c, k) => `<button data-c="${k + 1}"><i>${c.n.slice(1)}</i>${c.t.split(' &')[0]}</button>`).join('');
  $('#chipsbar').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => go(STEPS.findIndex((x) => x.c === +b.dataset.c))));
  $('#prev').addEventListener('click', () => go(idx - 1));
  $('#next').addEventListener('click', () => go(idx + 1));
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { go(idx + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { go(idx - 1); e.preventDefault(); }
    else if (e.key === 'Home') go(0);
    else if (e.key === 'End') go(STEPS.length - 1);
  });

  // fit the 1280 × 800 canvas to the stage, as large as it goes
  function fit() {
    const st = $('#stage');
    const k = Math.min(st.clientWidth / 1280, st.clientHeight / 800);
    const w = 1280 * k, h = 800 * k;
    const fr = $('#frame');
    fr.style.width = `${w}px`;
    fr.style.height = `${h}px`;
    fr.style.left = `${(st.clientWidth - w) / 2}px`;
    fr.style.top = `${(st.clientHeight - h) / 2}px`;
    canvas.style.transform = `scale(${k})`;
  }
  window.addEventListener('resize', fit);

  const tip = $('#tip');
  document.addEventListener('mousemove', (e) => {
    const t = e.target.closest && e.target.closest('[data-tip]');
    if (!t) { tip.style.opacity = 0; return; }
    tip.textContent = t.dataset.tip; tip.style.opacity = 1;
    tip.style.left = `${e.clientX + 14}px`; tip.style.top = `${e.clientY + 14}px`;
  });

  fit();
  draw();
})();
</script>
</body>
</html>
