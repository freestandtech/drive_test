<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Citroën Test Drive Demo</title>
<meta name="description" content="Basalt X test drive, end to end: booking, validation, dealer fulfilment, confirmation and AI calling. A FreeStand demo.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>:root {
  --red: #da291c;
  --red-tint: #fdecea;
  --char: #1b1d22;
  --ink: #13203b;
  --sub: #5b6474;
  --muted: #8a93a3;
  --line: #e4e7ec;
  --soft: #f5f6f8;
  --green: #16a34a;
  --green-tint: #e8f6ee;
  --amber: #b45309;
  --amber-tint: #fff6e0;
  --blue: #1d4ed8;
  --stage-bg: #26272b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--stage-bg);
  color: #f5f5f5;
  font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button { font-family: inherit; }

/* ── shell ─────────────────────────────────────────── */
.shell { min-height: 100vh; padding: 22px 28px 26px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.top { width: var(--cw); display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; }
.eyebrow { font-size: 10px; letter-spacing: 2.4px; opacity: .5; text-transform: uppercase; }
.brandline { display: flex; align-items: center; gap: 14px; margin-top: 6px; }
.brandline .mark { width: 40px; height: 40px; border-radius: 10px; background: var(--red); display: grid; place-items: center; }
.brandline .t { font-size: 26px; font-weight: 300; letter-spacing: 4px; }
.brandline .t span { opacity: .42; letter-spacing: 2px; }
.stages { display: flex; gap: 6px; }
.stages div { font-size: 10.5px; font-weight: 600; letter-spacing: .6px; padding: 7px 11px; border-radius: 999px; border: 1px solid rgba(255,255,255,.16); color: rgba(255,255,255,.55); white-space: nowrap; transition: all .25s; }
.stages div b { font-weight: 800; margin-right: 6px; opacity: .7; }
.stages div.on { background: var(--red); border-color: var(--red); color: #fff; }
.stages div.done { color: rgba(255,255,255,.85); border-color: rgba(255,255,255,.35); }
.stagewrap { width: var(--cw); height: var(--ch); position: relative; }
.canvas { position: absolute; left: 0; top: 0; width: 1280px; height: 890px; transform-origin: 0 0; background: #fff; border-radius: 8px; overflow: hidden; color: var(--ink); box-shadow: 0 30px 80px rgba(0,0,0,.5); }
.nav { width: var(--cw); }
.groups { display: grid; gap: 3px; margin-bottom: 4px; }
.groups div { font-size: 9.5px; font-weight: 700; letter-spacing: 1.6px; color: rgba(255,255,255,.4); text-transform: uppercase; border-top: 2px solid rgba(255,255,255,.12); padding-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.groups div.on { color: #fff; border-color: var(--red); }
.segs { display: grid; gap: 3px; }
.segs button { height: 28px; border: none; border-radius: 3px; background: rgba(255,255,255,.1); color: #fff; font-size: 9.5px; font-weight: 600; cursor: pointer; transition: background .2s; }
.segs button.past { background: rgba(255,255,255,.36); }
.segs button.on { background: var(--red); }
.segs button:hover { outline: 1px solid rgba(255,255,255,.5); }
.navrow { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 12px; }
.navrow button { background: rgba(255,255,255,.14); color: #fff; border: 1px solid rgba(255,255,255,.18); padding: 8px 18px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
.navrow button:disabled { background: rgba(255,255,255,.04); color: rgba(255,255,255,.3); cursor: not-allowed; }
.navrow button.next:not(:disabled) { background: var(--red); border-color: var(--red); }
.navrow .hint { font-size: 10.5px; opacity: .5; font-family: ui-monospace, Menlo, monospace; text-align: center; }
.navrow .hint b { color: #fff; opacity: 1; font-family: Inter, sans-serif; font-weight: 600; letter-spacing: .3px; }

/* ── animation ─────────────────────────────────────── */
@keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
@keyframes blink { 50% { opacity: .25; } }
@keyframes dash { to { stroke-dashoffset: -32; } }
@keyframes pulse { 0% { transform: scale(.7); opacity: .6; } 100% { transform: scale(1.6); opacity: 0; } }
@keyframes wbar { 50% { transform: scaleY(.35); } }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes dash2 { to { stroke-dashoffset: 0; } }
@keyframes spin { to { transform: rotate(360deg); } }
.in { animation: fadeInUp .4s both; }
.sv-pop { animation: pop .45s both; transform-box: fill-box; transform-origin: center; }
.blink { animation: blink 1.3s infinite; }
.flow { animation: dash 1.2s linear infinite; }
.pulse { animation: pulse 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
.wbar { animation: wbar .9s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.spin { animation: spin 1s linear infinite; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ── scene ─────────────────────────────────────────── */
.scene { position: absolute; inset: 0; background: #e8eef6; }
.loc { position: absolute; left: 0; right: 0; top: 0; height: 48px; background: var(--char); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 700; letter-spacing: .3em; border-bottom: 3px solid var(--red); z-index: 2; }
.scene .art { position: absolute; left: 0; right: 0; top: 48px; bottom: 0; }
.scene-svg { width: 100%; height: 100%; display: block; }
.caption { position: absolute; left: 30px; bottom: 28px; max-width: 760px; display: flex; gap: 14px; align-items: center; padding: 14px 20px 14px 14px; background: var(--char); border-radius: 8px; color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,.28); animation: fadeInUp .5s .25s both; z-index: 3; }
.caption .chip { background: var(--red); font-size: 10.5px; font-weight: 800; letter-spacing: 1.5px; padding: 6px 10px; border-radius: 4px; white-space: nowrap; }
.caption .tt { font-size: 15.5px; font-weight: 700; }
.caption .ss { font-size: 12px; color: #c9ced6; margin-top: 3px; line-height: 1.45; }

/* ── phone + panel layout ──────────────────────────── */
.split { position: absolute; inset: 0; background: #fff; }
.split .stepnote { position: absolute; left: 443px; top: 806px; width: 807px; display: flex; align-items: center; gap: 12px; font-size: 12.5px; color: var(--sub); animation: fadeInUp .45s .2s both; }
.split .stepnote .chip { background: var(--char); color: #fff; font-size: 10px; font-weight: 800; letter-spacing: 1.4px; padding: 5px 9px; border-radius: 4px; white-space: nowrap; }
.split .stepnote .chip.red { background: var(--red); }
.split .stepnote b { color: var(--ink); }
.phone { position: absolute; left: 27px; top: 43px; width: 375px; height: 800px; border-radius: 34px; overflow: hidden; background: #fff; box-shadow: 0 14px 40px rgba(0,0,0,.28), 0 0 0 7px #111; display: flex; flex-direction: column; }
.phone .status { height: 30px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 11px; font-weight: 700; }
.phone .status i { font-style: normal; font-weight: 600; font-size: 10px; opacity: .85; }
.panel { position: absolute; left: 443px; top: 43px; width: 807px; height: 746px; border-radius: 12px; border: 5px solid var(--char); background: #fff; overflow: hidden; display: flex; flex-direction: column; animation: fadeInUp .4s both; }
.ph { height: 72px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 22px; box-shadow: 0 4px 6px rgba(0,0,0,.06); position: relative; z-index: 2; }
.ph .ic { width: 40px; height: 40px; border-radius: 50%; background: var(--soft); border: 1.5px solid var(--char); display: grid; place-items: center; font-size: 17px; }
.ph .tt { font-size: 19px; font-weight: 650; }
.ph .ss { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.ph .st { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 10.5px; font-family: ui-monospace, Menlo, monospace; color: #555; }
.ph .st i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: blink 1.4s infinite; }
.pb { flex: 1; padding: 20px 26px; overflow: hidden; }
.sec { font-size: 10.5px; font-weight: 800; letter-spacing: 1.6px; color: var(--char); text-transform: uppercase; margin: 0 0 9px; }
.sec .r { float: right; color: var(--muted); font-weight: 700; letter-spacing: 1px; }

/* rows, chips, cards */
.chk { display: flex; align-items: center; gap: 12px; padding: 9px 13px; border-radius: 8px; margin-bottom: 7px; background: var(--green-tint); border: 1px solid #b7e2c6; }
.chk .d { width: 24px; height: 24px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 800; flex: none; }
.chk .t { font-size: 13px; font-weight: 700; }
.chk .s { font-size: 11px; color: var(--sub); margin-top: 1px; }
.chk .v { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--green); white-space: nowrap; font-family: ui-monospace, Menlo, monospace; }
.chk.wait { background: var(--amber-tint); border-color: #f1dca4; }
.chk.wait .d { background: #d79b00; }
.chk.wait .v { color: var(--amber); }
.chk.info { background: #eef3fb; border-color: #cfdcf0; }
.chk.info .d { background: #3a6fb8; }
.chk.info .v { color: #2a5596; }
.chk.off { background: var(--soft); border-color: var(--line); }
.chk.off .d { background: #b9bfc9; }
.chk.off .t { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip2 { font-size: 11.5px; font-weight: 600; padding: 5px 10px; border-radius: 5px; background: #e6edf7; color: var(--ink); }
.chip2.red { background: var(--red-tint); color: #9b1c12; }
.chip2.green { background: var(--green-tint); color: #11622f; }
.chip2.amber { background: #fff1d1; color: #7a4a00; }
.chip2.dark { background: var(--char); color: #fff; }
.chip2.new { animation: pop .4s .3s both; box-shadow: 0 0 0 2px var(--red) inset; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; background: #fff; }
.kv { display: grid; grid-template-columns: 120px 1fr; row-gap: 9px; column-gap: 12px; font-size: 13px; }
.kv .k { color: var(--muted); }
.kv .v { font-weight: 650; }
.kv .v.mono, .mono { font-family: ui-monospace, Menlo, monospace; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); border-radius: 3px; transform-origin: left; animation: grow .9s .2s both; }
.note { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: 10px; background: #f3f4f6; border: 1px solid var(--line); font-size: 12px; line-height: 1.55; color: #3b4352; }
.note .i { font-size: 18px; line-height: 1.2; }
.note b { color: var(--char); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.big { font-size: 30px; font-weight: 800; letter-spacing: -.5px; }
.lbl { font-size: 11px; color: var(--muted); }
.av { border-radius: 10px; overflow: hidden; border: 2px solid #d8dde6; background: #e7edf5; }
.av svg { width: 100%; height: 100%; display: block; }

/* ── WhatsApp ─────────────────────────────────────── */
.wa .status { background: #075e54; color: #fff; }
.wa .hd { height: 56px; flex: none; background: #075e54; color: #fff; display: flex; align-items: center; gap: 10px; padding: 0 12px; }
.wa .hd .lg { width: 36px; height: 36px; border-radius: 50%; background: var(--char); display: grid; place-items: center; }
.wa .hd .n { font-size: 14.5px; font-weight: 700; display: flex; align-items: center; gap: 4px; }
.wa .hd .n img { width: 14px; height: 14px; }
.wa .hd .o { font-size: 10.5px; opacity: .8; }
.wa .hd .ac { margin-left: auto; display: flex; gap: 16px; font-size: 15px; opacity: .9; }
.wa .body { flex: 1; overflow-y: auto; padding: 10px 10px 6px; background-color: #ece5dd; scroll-behavior: smooth; scrollbar-width: none; }
.wa .body::-webkit-scrollbar { display: none; }
.wa .foot { height: 52px; flex: none; background: #f0f0f0; display: flex; align-items: center; gap: 8px; padding: 0 10px; }
.wa .foot .in2 { flex: 1; height: 34px; border-radius: 17px; background: #fff; display: flex; align-items: center; padding: 0 14px; font-size: 12px; color: #9aa0a6; }
.wa .foot .mic { width: 36px; height: 36px; border-radius: 50%; background: #075e54; display: grid; place-items: center; color: #fff; font-size: 14px; }
.div { text-align: center; margin: 10px 0 8px; }
.div span { font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #54656f; background: rgba(255,255,255,.88); padding: 4px 10px; border-radius: 7px; }
.sysm { text-align: center; margin-bottom: 10px; }
.sysm span { display: inline-block; font-size: 9.5px; color: #7a5b00; background: #fff3c4; padding: 5px 10px; border-radius: 7px; line-height: 1.4; }
.msg { display: flex; margin-bottom: 7px; }
.msg.u { justify-content: flex-end; }
.msg .b { max-width: 84%; background: #fff; border-radius: 0 10px 10px 10px; padding: 8px 11px 6px; font-size: 12.5px; line-height: 1.48; white-space: pre-wrap; box-shadow: 0 1px 1px rgba(0,0,0,.08); }
.msg.u .b { background: #d9fdd3; border-radius: 10px 0 10px 10px; }
.msg .tm { display: block; text-align: right; font-size: 9px; color: #8a9499; margin-top: 2px; }
.msg.u .tm { color: #5a9a6a; }
.opts { display: flex; flex-direction: column; gap: 4px; margin: 6px -11px -6px; border-top: 1px solid #eef0f1; }
.opts div { text-align: center; font-size: 12px; font-weight: 600; color: #027eb5; padding: 7px 0; border-bottom: 1px solid #eef0f1; }
.opts div:last-child { border-bottom: none; }
.opts div.pk { background: #eaf6fc; }
.wacard { margin: -2px -5px 6px; border-radius: 8px; overflow: hidden; border: 1px solid #eceff1; }
.dlimg { width: 210px; }
.locimg { width: 220px; height: 110px; border-radius: 8px; overflow: hidden; }

/* ── browser / website ─────────────────────────────── */
.br .status { background: #fff; color: #111; }
.br .url { height: 42px; flex: none; display: flex; align-items: center; padding: 0 12px; background: #fff; border-bottom: 1px solid #eceef1; }
.br .url div { flex: 1; height: 30px; border-radius: 15px; background: #f1f3f4; display: flex; align-items: center; gap: 6px; padding: 0 12px; font-size: 11.5px; color: #3c4043; }
.site-hd { height: 50px; flex: none; background: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #eceef1; }
.site-hd .w { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: 3px; font-size: 14px; color: #111; }
.site { flex: 1; overflow: hidden; position: relative; background: #fff; }
.hero { background: linear-gradient(160deg, #1b1d22 0%, #3a1216 100%); color: #fff; padding: 16px 18px 6px; }
.hero .k { font-size: 10px; letter-spacing: 2px; color: #f3b4b8; font-weight: 700; }
.hero .h { font-size: 24px; font-weight: 800; letter-spacing: .5px; margin-top: 2px; }
.hero .s { font-size: 11px; color: #cbd5e1; }
.hero svg { width: 100%; height: 118px; display: block; margin-top: 4px; }
.form { padding: 12px 16px; }
.fl { font-size: 10.5px; font-weight: 700; color: #4b5563; letter-spacing: .4px; margin: 10px 0 5px; text-transform: uppercase; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg div { flex: 1; text-align: center; font-size: 11.5px; font-weight: 600; padding: 8px 4px; border-radius: 6px; border: 1.5px solid #d6dae0; color: #374151; white-space: nowrap; }
.seg div.on { border-color: #111; background: #111; color: #fff; }
.seg div small { display: block; font-size: 9.5px; font-weight: 500; opacity: .7; }
.inp { height: 38px; border: 1.5px solid #d6dae0; border-radius: 6px; display: flex; align-items: center; padding: 0 12px; font-size: 13px; color: #111; gap: 8px; }
.inp.ok { border-color: var(--green); }
.inp .pre { color: #6b7280; }
.inp .tick { margin-left: auto; color: var(--green); font-weight: 800; font-size: 12px; }
.cons { display: flex; gap: 8px; font-size: 10.5px; color: #4b5563; line-height: 1.4; margin-top: 10px; }
.cons .bx { width: 16px; height: 16px; border-radius: 3px; background: #111; color: #fff; font-size: 11px; display: grid; place-items: center; flex: none; }
.cta { margin-top: 12px; height: 44px; border-radius: 6px; background: var(--red); color: #fff; font-weight: 800; font-size: 14px; display: grid; place-items: center; letter-spacing: .4px; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 18px 18px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,.25); padding: 18px 18px 22px; animation: fadeInUp .45s both; }
.dim { position: absolute; inset: 0; background: rgba(10,12,16,.45); animation: fadeInUp .3s both; }
.otp { display: flex; gap: 8px; margin: 14px 0 8px; }
.otp div { flex: 1; height: 46px; border: 1.5px solid #d6dae0; border-radius: 8px; display: grid; place-items: center; font-size: 20px; font-weight: 700; }
.otp div.f { border-color: #111; }

/* ── dealer app ────────────────────────────────────── */
.dl .status { background: var(--char); color: #fff; }
.dl .hd { flex: none; background: var(--char); color: #fff; padding: 6px 16px 14px; }
.dl .hd .a { display: flex; align-items: center; gap: 10px; }
.dl .hd .a img { width: 26px; height: 26px; border-radius: 6px; background: #fff; padding: 3px; }
.dl .hd .n { font-size: 14px; font-weight: 700; }
.dl .hd .o { font-size: 10.5px; color: #b8bec7; }
.dl .bd { flex: 1; background: #f3f4f6; padding: 12px; overflow: hidden; }
.lead { background: #fff; border-radius: 12px; border: 2px solid var(--red); overflow: hidden; animation: pop .45s both; }
.lead .tp { background: var(--red); color: #fff; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 800; letter-spacing: 1px; }
.lead .in3 { padding: 12px; }
.grade { width: 44px; height: 44px; border-radius: 10px; background: var(--green); color: #fff; display: grid; place-items: center; font-size: 22px; font-weight: 900; flex: none; }
.btn { height: 44px; border-radius: 8px; display: grid; place-items: center; font-weight: 800; font-size: 13.5px; }
.btn.red { background: var(--red); color: #fff; }
.btn.dark { background: var(--char); color: #fff; }
.btn.ghost { border: 1.5px solid #cfd4db; color: #374151; }
.btn.green { background: var(--green); color: #fff; }
.opt { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; border: 1.5px solid #e1e4e8; background: #fff; margin-bottom: 7px; }
.opt.on { border-color: var(--char); box-shadow: 0 0 0 1px var(--char) inset; }
.opt .rd { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #c3c8cf; flex: none; }
.opt.on .rd { border: 5px solid var(--char); }

/* ── call screen ───────────────────────────────────── */
.call { background: linear-gradient(180deg, #1b1d22, #2a1316); color: #fff; }
.call .status { color: #fff; }

/* ── full-canvas pages ─────────────────────────────── */
.full { position: absolute; inset: 0; background: #fff; }
.dash { position: absolute; inset: 0; display: grid; grid-template-columns: 210px 1fr; }
.side { background: var(--char); color: #c9ced6; padding: 18px 0; display: flex; flex-direction: column; }
.side .lg { display: flex; align-items: center; gap: 8px; padding: 0 18px 18px; border-bottom: 1px solid rgba(255,255,255,.08); }
.side .lg img { height: 18px; filter: brightness(0) invert(1); }
.side a { display: flex; align-items: center; gap: 10px; padding: 10px 18px; font-size: 12.5px; color: inherit; text-decoration: none; }
.side a.on { background: rgba(255,255,255,.08); color: #fff; box-shadow: inset 3px 0 0 var(--red); }
.main { padding: 22px 28px; overflow: hidden; background: #f6f7f9; }
.kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.kpi { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.kpi .v { font-size: 22px; font-weight: 800; color: var(--ink); }
.kpi .l { font-size: 11px; color: var(--sub); margin-top: 2px; }
.kpi .d { font-size: 10.5px; color: var(--green); font-weight: 700; margin-top: 4px; }
.funnel .row { display: grid; grid-template-columns: 170px 1fr 110px; align-items: center; gap: 12px; margin-bottom: 8px; font-size: 12px; }
.funnel .row .b { height: 22px; background: #eef0f3; border-radius: 0 4px 4px 0; position: relative; }
.funnel .row .b i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--char); border-radius: 0 4px 4px 0; transform-origin: left; animation: grow .9s both; }
.funnel .row .b i.hi { background: var(--red); }
.funnel .row .n { font-weight: 700; color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
.funnel .row .n small { color: var(--muted); font-weight: 600; margin-left: 4px; }
table.t { width: 100%; border-collapse: collapse; font-size: 12px; }

<script>/* Citroën Basalt X test-drive demo: booking → validation → dealer fulfilment → confirmation & AI calling.
   Vanilla JS; scenes, avatars and car drawings are pre-rendered at build time into window.__DATA. */
(function () {
  const D = window.__DATA;
  const RED = '#da291c';

  // ───────────────────────────── helpers ─────────────────────────────
  const chev = (size = 16, col = '#fff') => {
    const w = size / 2, t = Math.max(1.4, w * 0.34);
    const v = (dy) => `<path d="M${-w} ${dy + w * 0.42}L0 ${dy - w * 0.08}L${w} ${dy + w * 0.42}" fill="none" stroke="${col}" stroke-width="${t}" stroke-linecap="square"/>`;
    return `<svg width="${size}" height="${size}" viewBox="${-w * 1.15} ${-w * 1.05} ${w * 2.3} ${w * 2.1}">${v(-w * 0.42)}${v(w * 0.36)}</svg>`;
  };
  const ph = (icon, title, sub, st = 'LIVE', col) =>
    `<div class="ph"><div class="ic">${icon}</div><div><div class="tt">${title}</div><div class="ss">${sub}</div></div><div class="st"><i style="${col ? `background:${col}` : ''}"></i>${st}</div></div>`;
  const chk = (t, s, v = '', cls = '', d = 0) =>
    `<div class="chk ${cls} in" style="animation-delay:${d}s"><div class="d">${cls === 'wait' ? '…' : cls === 'off' ? '–' : cls === 'info' ? 'i' : '✓'}</div><div><div class="t">${t}</div>${s ? `<div class="s">${s}</div>` : ''}</div>${v ? `<div class="v">${v}</div>` : ''}</div>`;
  const chips = (arr) => `<div class="chips">${arr.map((c) => (typeof c === 'string' ? `<span class="chip2">${c}</span>` : `<span class="chip2 ${c[1]}">${c[0]}</span>`)).join('')}</div>`;
  const note = (i, html) => `<div class="note"><div class="i">${i}</div><div>${html}</div></div>`;
  const av = (k, sz) => `<div class="av" style="width:${sz}px;height:${sz}px">${D.avatars[k]}</div>`;
  const stepnote = (chip, html, red) => `<div class="stepnote"><span class="chip ${red ? 'red' : ''}">${chip}</span><span>${html}</span></div>`;

  // ───────────────────────────── the persona and the facts ─────────────────────────────
  const P = {
    name: 'Shubham Kohli', phone: '+91 98374 92834', masked: '98XXX XX834', email: 'shubham.kohli@gmail.com',

            ${chk('Quote shared', 'Indicative on-road price + exchange estimate on WhatsApp', 'SENT', '', 0.4)}
            ${chk('Follow-up booked', 'AI call in 48 h if no booking · Ranjan gets the transcript', 'SCHEDULED', 'wait', 0.55)}
          </div>
          <div><div class="sec">Relevant cohorts</div>
            ${chips([['Test drive: done', 'green new'], ['Hot lead', 'red new'], ['Exchange: Swift 2017', 'amber'], ['Finance-ready', 'green'], ['In-market · 0–30 days', 'red'], ['Grade A', 'dark']])}
            <div class="sec" style="margin-top:16px">Next best action</div>
            <div class="card" style="display:flex;gap:12px;align-items:center"><span style="font-size:22px">📝</span><div><div style="font-weight:700;font-size:13px">Send a ₹11,000 booking link with the exchange bonus</div><div class="lbl">Hot leads who see a price within 2 h book 2.3× more often (demo data)</div></div></div>
            <div class="card" style="display:flex;gap:12px;align-items:center;margin-top:8px"><span style="font-size:22px">🎯</span><div><div style="font-weight:700;font-size:13px">Add to the lookalike seed</div><div class="lbl">Grade-A test-drivers improve paid-social targeting for the next wave</div></div></div>
          </div></div>
      </div></div>`;
  }

  // ───────────────────────────── full-canvas pages ─────────────────────────────
  function cover() {
    const stages = [['01', 'Booking', 'Website or app, 60-second booking'], ['02', 'Validation', 'Licence, credit, address, enrichment'], ['03', 'Fulfilment', 'Nearest 3 dealers race to accept'], ['04', 'Confirmation', 'WhatsApp + AI calling to the drive']];
    return `<div class="scene"><div class="art" style="top:0">${D.scenes.cover}</div>
      <div style="position:absolute;left:54px;top:50px;max-width:640px;animation:fadeInUp .6s both">
        <div style="display:flex;align-items:center;gap:12px"><span style="width:44px;height:44px;border-radius:10px;background:${RED};display:grid;place-items:center">${chev(26)}</span><span style="font-size:13px;font-weight:800;letter-spacing:3px;color:#1b1d22">CITROËN × <img src="${D.img.fs}" alt="FreeStand" style="height:14px;vertical-align:-1px;margin-left:4px"></span></div>
        <div style="font-size:44px;font-weight:800;line-height:1.08;letter-spacing:-1px;margin-top:22px;color:#13203b">Every test drive verified,<br>routed and confirmed.</div>
        <div style="font-size:16px;color:#5b6474;margin-top:12px;line-height:1.5">Follow one Basalt X lead from an Instagram ad to the handover at Shubham’s gate.</div></div>
      <div style="position:absolute;left:54px;right:54px;bottom:44px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px">${stages.map((s, i) => `<div style="background:#1b1d22;color:#fff;border-radius:10px;padding:14px 16px;animation:fadeInUp .5s ${0.3 + i * 0.12}s both"><div style="font-size:11px;font-weight:800;color:#f3b4b8;letter-spacing:2px">${s[0]}</div><div style="font-size:16px;font-weight:800;margin-top:4px">${s[1]}</div><div style="font-size:12px;color:#c9ced6;margin-top:3px">${s[2]}</div></div>`).join('')}</div></div>`;
  }

  function analytics() {
    const F = [['Test drives booked', 12480], ['Mobile verified (OTP)', 11902], ['Validated (DL + address)', 9861], ['Accepted by a dealer', 9402], ['Confirmed by AI call', 8577], ['Test drives done', 7118], ['Cars booked', 1281]];
    const max = F[0][1];
    const fmt = (n) => n.toLocaleString('en-IN');
    const funnel = F.map(([l, v], i) => `<div class="row"><span>${l}</span><div class="b" data-tip="${l}: ${fmt(v)} (${((v / max) * 100).toFixed(1)}% of bookings)"><i class="${i === F.length - 1 ? 'hi' : ''}" style="width:${(v / max) * 100}%;animation-delay:${i * 0.08}s"></i></div><span class="n">${fmt(v)}<small>${i ? ((v / F[i - 1][1]) * 100).toFixed(0) + '%' : ''}</small></span></div>`).join('');
    const R = [['Invalid or expired licence', 742], ['Address not serviceable', 498], ['Duplicate lead', 381], ['Dealer or agent number', 236], ['Consent withdrawn', 184]];
    const rmax = R[0][1];
    const reasons = R.map(([l, v], i) => `<div class="row" style="grid-template-columns:180px 1fr 52px"><span>${l}</span><div class="b" data-tip="${l}: ${fmt(v)} leads stopped before a dealer saw them"><i style="width:${(v / rmax) * 100}%;background:#8a93a3;animation-delay:${i * 0.08}s"></i></div><span class="n">${fmt(v)}</span></div>`).join('');
    const T = [['Kirti Nagar', 1214, 1152, '1 m 52 s', '81%', 214], ['Punjabi Bagh', 1032, 958, '2 m 05 s', '79%', 176], ['Janakpuri', 1086, 1001, '2 m 30 s', '77%', 171], ['Dwarka', 790, 731, '3 m 12 s', '74%', 118], ['Karol Bagh', 874, 772, '4 m 10 s', '68%', 102]];
    return `<div class="full"><div class="dash"><div class="side"><div class="lg"><img src="${D.img.fs}" alt="FreeStand"></div>
      ${[['📊', 'Overview', 1], ['🚗', 'Test drives'], ['🛡️', 'Validation'], ['🏢', 'Dealers'], ['🎙️', 'AI calls'], ['💬', 'WhatsApp'], ['👥', 'Audiences'], ['⚙️', 'Settings']].map(([i, t, on]) => `<a class="${on ? 'on' : ''}">${i} ${t}</a>`).join('')}
      <div style="margin-top:auto;padding:0 18px;font-size:11px;opacity:.6">Citroën India · Delhi NCR<br>Basalt X test-drive programme</div></div>
      <div class="main">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px"><div><div style="font-size:20px;font-weight:800">Test-drive programme · Delhi NCR</div><div class="lbl">Basalt X · 1 Aug – 21 Oct 2026 · 5 dealers · demo data</div></div><div class="chips"><span class="chip2">Last 12 weeks ▾</span><span class="chip2">All dealers ▾</span><span class="chip2 dark">Export</span></div></div>
        <div class="kpis">
          <div class="kpi"><div class="v">12,480</div><div class="l">Test drives booked</div><div class="d">▲ 18% vs prior 12 wks</div></div>
          <div class="kpi"><div class="v">79%</div><div class="l">Validated before a dealer saw them</div><div class="d">2,041 junk leads stopped</div></div>
          <div class="kpi"><div class="v">2 m 41 s</div><div class="l">Median dealer acceptance</div><div class="d">95% inside the 15-min SLA</div></div>
          <div class="kpi"><div class="v">76%</div><div class="l">Show-up rate</div><div class="d">after AI confirmation calls</div></div>
          <div class="kpi"><div class="v">18%</div><div class="l">Drive → booking</div><div class="d">1,281 cars booked</div></div>
        </div>
        <div style="display:grid;grid-template-columns:1.25fr 1fr;gap:12px;margin-top:12px">
          <div class="card funnel"><div class="sec">Funnel · ad to booking</div>${funnel}</div>
          <div class="card funnel"><div class="sec">Why leads were stopped <span class="r">2,041</span></div>${reasons}
            <div class="sec" style="margin-top:14px">AI calls</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:11.5px"><div><div style="font-size:18px;font-weight:800">21,340</div><div class="lbl">calls placed</div></div><div><div style="font-size:18px;font-weight:800">73%</div><div class="lbl">answered</div></div><div><div style="font-size:18px;font-weight:800">1,912</div><div class="lbl">reschedules handled</div></div></div></div>
        </div>
        <div class="card" style="margin-top:12px"><div class="sec">Dealer leaderboard</div><table class="t"><thead><tr><th>Dealer</th><th class="r">Offered</th><th class="r">Accepted</th><th class="r">Median accept</th><th class="r">Show-up</th><th class="r">Bookings</th></tr></thead><tbody>${T.map((r) => `<tr><td><b>La Maison Citroën · ${r[0]}</b></td><td class="r">${fmt(r[1])}</td><td class="r">${fmt(r[2])}</td><td class="r">${r[3]}</td><td class="r">${r[4]}</td><td class="r"><b>${r[5]}</b></td></tr>`).join('')}</tbody></table></div>
      </div></div></div>`;
  }

  function thanks() {
    const rows = [['Booking', 'Ad → website → OTP → WhatsApp in under a minute'], ['Validation', 'Licence, soft credit, address quality and intent: a grade-A lead'], ['Fulfilment', 'Nearest 3 dealers raced; Kirti Nagar won in 1 m 48 s'], ['Confirmation & AI calling', 'Confirmed, rescheduled by voice, tracked to the gate']];
    return `<div class="scene" style="background:#141518"><div style="position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:0 70px;gap:50px;color:#fff">
      <div style="animation:fadeInUp .6s both"><span style="width:56px;height:56px;border-radius:12px;background:${RED};display:grid;place-items:center">${chev(32)}</span><div style="font-size:46px;font-weight:800;line-height:1.08;margin-top:26px;letter-spacing:-1px">Thank you.</div><div style="font-size:17px;color:#c9ced6;margin-top:14px;line-height:1.55">One lead, four stages, zero manual follow-up.<br>Every test drive verified before a dealer spends a minute on it.</div><div style="margin-top:28px;display:flex;align-items:center;gap:10px;font-size:12px;color:#9aa3ad">Powered by <img src="${D.img.fs}" alt="FreeStand" style="height:16px;filter:brightness(0) invert(1)"></div></div>
      <div>${rows.map((r, i) => `<div style="display:flex;gap:16px;align-items:flex-start;padding:18px 0;border-bottom:1px solid rgba(255,255,255,.1);animation:fadeInUp .5s ${0.2 + i * 0.12}s both"><span style="font-size:13px;font-weight:800;color:${RED};width:28px">0${i + 1}</span><div><div style="font-size:18px;font-weight:700">${r[0]}</div><div style="font-size:13px;color:#9aa3ad;margin-top:3px">${r[1]}</div></div></div>`).join('')}</div></div></div>`;
  }

  // ───────────────────────────── steps ─────────────────────────────
  const GROUPS = ['Intro', 'Booking', 'Validation', 'Fulfilment', 'Confirmation & AI calling', 'Results'];
  const scene = (name, loc, n, tt, ss) => ({ kind: 'scene', name, loc, n, tt, ss });
  const STEPS = [
    { g: 0, label: 'Cover', render: cover },
    { g: 1, label: 'Sees the ad', ...scene('ad', 'HOME · RAJOURI GARDEN, NEW DELHI · MON 19 OCT · 9:12 PM', 'STEP 1', 'Shubham sees the Basalt X ad', 'An Instagram ad deep-links to the test-drive page. The campaign source travels with the lead from here on.') },
    { g: 1, label: 'Books on the website', split: () => sitePhone('filled') + leadCapturedPanel() + stepnote('STEP 2', '<b>Booked in 48 seconds.</b> The lead exists in the CDP before he even taps “Book”: duplicate, PIN and spam checks run instantly.', true) },
    { g: 1, label: 'OTP + WhatsApp', split: () => sitePhone('otp') + profilePanel({ phone: 1, otp: 1, cohorts: [['Home test drive', 'new'], ['Instagram ad', 'new'], ['Basalt X · AT', 'new']], checks: [['Mobile verified', 'OTP auto-read · +91 98374 92834', 'OTP ✓'], ['WhatsApp opt-in', 'Consent artefact: test drive + offers · Mon 9:13:41 PM', 'DPDP ✓'], ['Driving licence', 'Next: on WhatsApp', 'PENDING', 'wait'], ['Credit (optional)', 'Next: on WhatsApp', 'PENDING', 'wait'], ['Address', 'Next: on WhatsApp', 'PENDING', 'wait']] }) + stepnote('STEP 3', '<b>One OTP, then WhatsApp.</b> The verified number and the consent record are the anchor for everything that follows.', true) },
    { g: 2, label: 'Driving licence', split: (pv) => waPhone(waEnd.dl, pv) + dlPanel() + stepnote('STEP 4', '<b>Licence first.</b> A photo on WhatsApp is read, checked against the government record and matched to the booking name.') , wa: waEnd.dl },
    { g: 2, label: 'Credit score', split: (pv) => waPhone(waEnd.credit, pv) + creditPanel() + stepnote('STEP 5', '<b>Optional soft credit check.</b> No impact on his score; the dealer only learns he’s finance-ready.'), wa: waEnd.credit },
    { g: 2, label: 'Address quality', split: (pv) => waPhone(waEnd.addr, pv) + addrPanel() + stepnote('STEP 6', '<b>Address that a driver can actually find.</b> Parsed, geocoded, scored, and checked for home test-drive serviceability.'), wa: waEnd.addr },
    { g: 2, label: 'Enriched lead', split: (pv) => waPhone(waEnd.intent, pv) + enrichedPanel() + stepnote('STEP 7', '<b>A grade-A lead.</b> Two more answers (current car, buying window) and the profile is ready to route.'), wa: waEnd.intent },
    { g: 3, label: 'Nearest 3 dealers', ...scene('map', 'LEAD ROUTING · WEST DELHI · MON 19 OCT · 9:16 PM', 'STEP 8', 'Offered to the 3 nearest dealerships', 'Only validated leads are routed. Each dealer sees a masked preview and has 15 minutes to accept.') },
    { g: 3, label: 'Dealer accepts', split: () => dealerPhone('offer') + broadcastPanel() + stepnote('STEP 9', '<b>First to accept wins.</b> Kirti Nagar takes it in 1 m 48 s; the other two offers close automatically.') },
    { g: 3, label: 'Showroom', ...scene('showroom', 'LA MAISON CITROËN · KIRTI NAGAR · MON 19 OCT · 9:17 PM', 'STEP 10', 'The nearest dealer takes over', 'The consultant accepts on the FreeStand Dealer app, and the full verified profile unlocks only now.') },
    { g: 3, label: 'Car + consultant', split: () => dealerPhone('assign') + allocationPanel() + stepnote('STEP 11', '<b>Consultant, demo car and slot in one tap.</b> The lead lands in the dealer DMS with a brief.') },
    { g: 4, label: 'WhatsApp confirmation', split: (pv) => waPhone(waEnd.confirm, pv) + commsPanel() + stepnote('STEP 12', '<b>Confirmed on WhatsApp in 2 minutes.</b> Reminders, the AI call and fallbacks are scheduled automatically.', true), wa: waEnd.confirm },
    { g: 4, label: 'AI call', ...scene('call', 'OFFICE · CYBER CITY, GURUGRAM · TUE 20 OCT · 5:42 PM', 'STEP 13', 'The AI calls the evening before', 'Aria confirms in Hinglish, moves the slot to 11:30 and briefs the dealer. Nobody at the showroom picks up a phone.') },
    { g: 4, label: 'Call outcome', split: () => callPhone() + callPanel() + stepnote('STEP 14', '<b>Every call becomes data.</b> The new time, the co-passenger and the exchange question go straight to Ranjan.', true) },
    { g: 4, label: 'Day-of tracking', split: (pv) => waPhone(waEnd.day, pv) + trackPanel() + stepnote('STEP 15', '<b>No “where are you?” calls.</b> Live location and a handover code arrive on WhatsApp.', true), wa: waEnd.day },
    { g: 4, label: 'Handover', ...scene('drive', 'VISHAL ENCLAVE · RAJOURI GARDEN · WED 21 OCT · 11:34 AM', 'STEP 16', 'Handover at the gate', 'The handover code starts the drive, and the licence is re-checked against the verified copy.') },
    { g: 4, label: 'Feedback', split: (pv) => waPhone(waEnd.fb, pv) + outcomePanel() + stepnote('STEP 17', '<b>From drive to quote in 90 minutes.</b> Feedback, an indicative price and the next step, with the dealer kept in the loop.', true), wa: waEnd.fb },
    { g: 5, label: 'Analytics', render: analytics },
    { g: 5, label: 'Thank you', render: thanks },
  ];

  // ───────────────────────────── render ─────────────────────────────
  const canvas = document.getElementById('canvas');
  const KEY = 'citroen-td-step';
  let idx = 0;
  try { idx = Math.min(Math.max(0, parseInt(localStorage.getItem(KEY) || '0', 10) || 0), STEPS.length - 1); } catch (e) {}
  let prev = idx;

  function draw() {
    const s = STEPS[idx];
    const ps = STEPS[prev];
    let html;
    if (s.render) html = s.render();
    else if (s.kind === 'scene')
      html = `<div class="scene"><div class="loc">${s.loc.split(' · ').join('<i style="font-style:normal;margin:0 .7em;opacity:.6">·</i>')}</div><div class="art">${D.scenes[s.name]}</div><div class="caption"><span class="chip">${s.n}</span><div><div class="tt">${s.tt}</div><div class="ss">${s.ss}</div></div></div></div>`;
    else {
      // only new WhatsApp messages animate: when stepping forward between chat steps, start after the last shown one
      const pv = s.wa && ps && ps.wa && prev < idx ? ps.wa : s.wa && prev === idx ? s.wa : 0;
      html = `<div class="split">${s.split(pv)}</div>`;
    }
    canvas.innerHTML = html;
    const wb = document.getElementById('wabody');
    if (wb) { wb.style.scrollBehavior = 'auto'; wb.scrollTop = wb.scrollHeight; }
    // nav
    document.querySelectorAll('.segs button').forEach((b, i) => (b.className = i === idx ? 'on' : i < idx ? 'past' : ''));
    document.querySelectorAll('.groups div').forEach((g) => g.classList.toggle('on', +g.dataset.g === s.g));
    document.querySelectorAll('.stages div').forEach((g) => { const k = +g.dataset.g; g.className = k === s.g ? 'on' : k < s.g ? 'done' : ''; });
    document.getElementById('prev').disabled = idx === 0;
    document.getElementById('next').disabled = idx === STEPS.length - 1;
    document.getElementById('where').innerHTML = `<b>${String(idx + 1).padStart(2, '0')} / ${STEPS.length} · ${s.label}</b> &nbsp; ← → keys · Home / End`;
    try { localStorage.setItem(KEY, String(idx)); } catch (e) {}
  }
  function go(i) { const n = Math.min(Math.max(0, i), STEPS.length - 1); if (n === idx) return; prev = idx; idx = n; draw(); }

  // nav markup: group labels spanning their steps, then one segment per step
  const segs = document.getElementById('segs');
  const groups = document.getElementById('groups');
  segs.style.gridTemplateColumns = groups.style.gridTemplateColumns = `repeat(${STEPS.length}, 1fr)`;
  segs.innerHTML = STEPS.map((s, i) => `<button title="${s.label}">${String(i + 1).padStart(2, '0')}</button>`).join('');
  segs.querySelectorAll('button').forEach((b, i) => b.addEventListener('click', () => go(i)));
  let gi = 0;
  groups.innerHTML = GROUPS.map((g, k) => { const n = STEPS.filter((s) => s.g === k).length; const start = gi + 1; gi += n; return `<div data-g="${k}" style="grid-column:${start} / span ${n}">${g}</div>`; }).join('');
  document.getElementById('stages').innerHTML = GROUPS.slice(1, 5).map((g, k) => `<div data-g="${k + 1}"><b>0${k + 1}</b>${g}</div>`).join('');
  document.getElementById('prev').addEventListener('click', () => go(idx - 1));
  document.getElementById('next').addEventListener('click', () => go(idx + 1));
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { go(idx + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { go(idx - 1); e.preventDefault(); }
    else if (e.key === 'Home') go(0);
    else if (e.key === 'End') go(STEPS.length - 1);
  });

  // fit the 1280 × 890 canvas to the window
  function fit() {
    const sc = Math.min(1, (window.innerWidth - 56) / 1280, (window.innerHeight - 210) / 890);
    const k = Math.max(0.4, sc);
    canvas.style.transform = `scale(${k})`;
    document.documentElement.style.setProperty('--cw', `${Math.round(1280 * k)}px`);
    document.documentElement.style.setProperty('--ch', `${Math.round(890 * k)}px`);
  }
  window.addEventListener('resize', fit);

  // hover tooltips for chart marks
  const tip = document.getElementById('tip');
  document.addEventListener('mousemove', (e) => {
    const t = e.target.closest && e.target.closest('[data-tip]');
    if (!t) { tip.style.opacity = 0; return; }
    tip.textContent = t.dataset.tip; tip.style.opacity = 1;
    tip.style.left = `${e.clientX + 14}px`; tip.style.top = `${e.clientY + 14}px`;
  });

  fit();
  draw();
})();
</script>
</body>
</html>
