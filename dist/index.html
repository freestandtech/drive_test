<style>/* Renault × FreeStand test-drive demo. FreeStand UI palette, quiet surfaces, real imagery. */
:root {
  --navy: #0d2a69;
  --primary: #0a3578;
  --blue: #1f4fd1;
  --orange: #ff6b00;
  --ink: #0b1324;
  --sub: #5b6b82;
  --muted: #98a3b5;
  --line: #e6eaf1;
  --bg: #f3f5f9;
  --tint: #eef3fc;
  --green: #129a4a;
  --green-tint: #eaf7ef;
  --amber: #b26b00;
  --amber-tint: #fff5e2;
  --renault: #000;
  --ry: #efdf00;
  --shadow: 0 1px 2px rgba(13, 42, 105, .04), 0 12px 40px rgba(13, 42, 105, .08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; font-feature-settings: 'cv11', 'ss01'; }
button { font-family: inherit; cursor: pointer; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ── shell ─────────────────────────────────────────── */
.app { height: 100vh; display: grid; grid-template-columns: 236px 1fr; gap: 20px; padding: 18px 22px 16px 18px; }
.rail { display: flex; flex-direction: column; min-height: 0; padding-top: 4px; }
.rail .logo { padding: 2px 10px 22px; display: flex; flex-direction: column; gap: 8px; }
.rail .logo img { height: 19px; align-self: flex-start; }
.rail .logo div { font-size: 10px; font-weight: 600; letter-spacing: 1.6px; color: var(--muted); text-transform: uppercase; }
.chap { border-radius: 12px; padding: 9px 10px; display: grid; grid-template-columns: 24px 1fr; gap: 11px; cursor: pointer; transition: background .2s; margin-bottom: 2px; }
.chap:hover { background: rgba(255,255,255,.7); }
.chap .n { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid #cdd6e6; color: var(--sub); display: grid; place-items: center; font-size: 10.5px; font-weight: 700; background: #fff; transition: all .25s; }
.chap .t { font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.3; padding-top: 3px; }
.chap.on { background: #fff; box-shadow: var(--shadow); }
.chap.on .n { background: var(--orange); border-color: var(--orange); color: #fff; }
.chap.done .n { background: var(--primary); border-color: var(--primary); color: #fff; }
.chap.done .t { color: var(--sub); }
.steps { grid-column: 2; margin: 6px 0 2px; display: flex; flex-direction: column; }
.steps div { display: flex; align-items: center; gap: 9px; font-size: 12px; color: var(--sub); padding: 5px 0; cursor: pointer; }
.steps div i { width: 6px; height: 6px; border-radius: 50%; background: #d3dbe8; flex: none; }
.steps div.past i { background: var(--primary); }
.steps div.cur { color: var(--primary); font-weight: 600; }
.steps div.cur i { background: var(--orange); box-shadow: 0 0 0 3px rgba(255,107,0,.16); }
.rail .foot { margin-top: auto; padding: 0 10px; font-size: 11px; color: var(--muted); line-height: 1.5; }
.rail .foot b { color: var(--ink); font-weight: 600; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding: 2px 4px 14px; min-height: 78px; }
.head .eb { font-size: 11px; font-weight: 600; letter-spacing: 1.6px; color: var(--muted); text-transform: uppercase; }
.head .eb b { color: var(--orange); font-weight: 700; }
.head h1 { font-size: 27px; font-weight: 700; color: var(--ink); letter-spacing: -.6px; margin-top: 6px; line-height: 1.15; }
.head p { font-size: 14px; color: var(--sub); margin-top: 5px; line-height: 1.5; max-width: 880px; }
.head .hx { animation: rise .5s both; }
.lockup { display: flex; align-items: center; gap: 14px; flex: none; padding-bottom: 6px; }
.lockup .rn { display: flex; align-items: center; gap: 9px; font-weight: 700; letter-spacing: 3.4px; font-size: 12.5px; color: #000; }
.lockup .rn svg { height: 26px; width: auto; }
.lockup .x { width: 1px; height: 22px; background: #d3d9e4; }
.lockup img { height: 15px; }
.stage { flex: 1; min-height: 0; position: relative; }
.frame { position: absolute; border-radius: 22px; overflow: hidden; background: #fff; box-shadow: var(--shadow); }
.canvas { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; transform-origin: 0 0; }
.slide { position: absolute; inset: 0; }
.slide.enter { animation: slideIn .55s cubic-bezier(.2,.7,.2,1) both; }
.slide.leave { animation: slideOut .25s ease-in both; }
.banner { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); z-index: 20; background: rgba(11,19,36,.92); backdrop-filter: blur(8px); color: #fff; border-radius: 999px; padding: 9px 18px 9px 9px; display: flex; align-items: center; gap: 12px; font-size: 13px; box-shadow: 0 12px 30px rgba(0,0,0,.25); animation: banner 3.4s ease both; white-space: nowrap; }
.banner b { background: var(--orange); border-radius: 999px; padding: 5px 11px; font-size: 10.5px; letter-spacing: 1.2px; font-weight: 700; }

.bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding-top: 14px; }
.bar .prev { justify-self: start; background: #fff; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 11px 18px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.bar .prev:disabled { opacity: .45; cursor: default; }
.bar .nextw { justify-self: end; display: flex; align-items: center; gap: 14px; }
.bar .upnext { font-size: 11px; color: var(--muted); text-align: right; line-height: 1.35; letter-spacing: .3px; }
.bar .upnext b { display: block; color: var(--ink); font-size: 13px; font-weight: 600; letter-spacing: 0; }
.bar .next { background: var(--primary); color: #fff; border: none; border-radius: 10px; padding: 12px 22px; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 20px rgba(10,53,120,.25); }
.bar .next:disabled { background: #c8d0dd; box-shadow: none; cursor: default; }
.bar .next.pulse { animation: nudge 1.8s ease-in-out infinite; }
.prog { display: flex; align-items: center; gap: 6px; }
.prog button { border: none; background: transparent; color: var(--sub); border-radius: 999px; padding: 7px 12px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.prog button i { width: 7px; height: 7px; border-radius: 50%; background: #cdd6e6; }
.prog button.on { background: #fff; color: var(--ink); box-shadow: var(--shadow); }
.prog button.on i { background: var(--orange); }
.prog button.done i { background: var(--primary); }
.prog .sep { width: 18px; height: 1px; background: #d3d9e4; }

/* ── motion ────────────────────────────────────────── */
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes slideIn { from { opacity: 0; transform: translateX(26px); } to { opacity: 1; transform: none; } }
@keyframes slideOut { to { opacity: 0; transform: translateX(-18px); } }
@keyframes pop { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes blink { 50% { opacity: .3; } }
@keyframes dash { to { stroke-dashoffset: -32; } }
@keyframes dash2 { to { stroke-dashoffset: 0; } }
@keyframes ping { 0% { transform: scale(.6); opacity: .55; } 100% { transform: scale(1.9); opacity: 0; } }
@keyframes wbar { 50% { transform: scaleY(.35); } }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes dots { 0%, 80%, 100% { transform: translateY(0); opacity: .35; } 40% { transform: translateY(-4px); opacity: 1; } }
@keyframes banner { 0% { opacity: 0; transform: translate(-50%, -12px); } 10%, 84% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -8px); } }
@keyframes nudge { 0%, 100% { box-shadow: 0 8px 20px rgba(10,53,120,.25); } 50% { box-shadow: 0 0 0 6px rgba(31,79,209,.18), 0 8px 20px rgba(10,53,120,.25); } }
@keyframes tap { 0% { transform: scale(1); } 40% { transform: scale(.96); background: #d6ecfa; } 100% { transform: scale(1); } }
@keyframes shimmer { from { background-position: -300px 0; } to { background-position: 300px 0; } }
@keyframes typeIn { to { width: var(--w, 10ch); } }
@keyframes kenburns { from { transform: scale(1.06); } to { transform: scale(1); } }
.in { animation: rise .5s both; }
.pop { animation: pop .45s both; }
.blink { animation: blink 1.3s infinite; }
.flow { animation: dash 1.2s linear infinite; }
.ping { animation: ping 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition: none !important; } }

/* ── full-canvas pages ─────────────────────────────── */
.full { position: absolute; inset: 0; background: #fff; overflow: hidden; }
.dark { background: #070b14; color: #fff; }
.kicker { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--orange); }
.display { font-size: 44px; font-weight: 700; letter-spacing: -1.4px; line-height: 1.06; }
.lede { font-size: 16px; line-height: 1.6; color: var(--sub); }
.dark .lede { color: #a9b4c8; }
.shot { border-radius: 20px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.08); background: #111; }
.shot img { display: block; width: 100%; }
.tl { position: relative; padding-left: 26px; }
.tl::before { content: ''; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 1px; background: rgba(255,255,255,.16); }
.tl .r { position: relative; margin-bottom: 16px; animation: rise .5s both; }
.tl .r::before { content: ''; position: absolute; left: -24px; top: 5px; width: 9px; height: 9px; border-radius: 50%; background: #3a4560; box-shadow: 0 0 0 4px #070b14; }
.tl .r.hot::before { background: #ff4d4f; }
.tl .r .tm { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: #7f8aa3; font-variant-numeric: tabular-nums; }
.tl .r .x { font-size: 14px; color: #e6eaf2; margin-top: 3px; line-height: 1.45; }
.tl .r.hot .x { color: #fff; font-weight: 600; }
.pain { border: 1px solid var(--line); border-radius: 18px; padding: 22px 22px 20px; background: #fff; display: flex; flex-direction: column; gap: 10px; animation: rise .5s both; }
.pain .no { font-size: 11px; font-weight: 700; letter-spacing: 1.6px; color: var(--muted); }
.pain .ic { width: 40px; height: 40px; border-radius: 12px; background: #fff1f0; color: #d93025; display: grid; place-items: center; }
.pain h3 { font-size: 17px; font-weight: 700; letter-spacing: -.3px; }
.pain p { font-size: 13px; line-height: 1.55; color: var(--sub); }
.pain .q { margin-top: auto; font-size: 12.5px; color: var(--ink); background: var(--bg); border-radius: 10px; padding: 10px 12px; line-height: 1.45; font-style: italic; }

/* ── phone + panel ─────────────────────────────────── */
.split { position: absolute; inset: 0; background: linear-gradient(180deg, #fafbfd, #f4f6fa); }
.phone { position: absolute; left: 40px; top: 16px; width: 360px; height: 768px; border-radius: 48px; overflow: hidden; background: #fff; box-shadow: 0 0 0 9px #0b0d12, 0 0 0 10px #2a2f3a, 0 30px 60px rgba(13,42,105,.22); display: flex; flex-direction: column; }
.phone::before { content: ''; position: absolute; left: 50%; top: 9px; width: 96px; height: 27px; border-radius: 20px; background: #0b0d12; transform: translateX(-50%); z-index: 5; }
.phone .status { height: 46px; flex: none; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 26px 6px 30px; font-size: 12px; font-weight: 600; }
.phone .status i { font-style: normal; font-weight: 600; font-size: 10.5px; letter-spacing: .5px; }
.panel { position: absolute; left: 444px; top: 16px; width: 806px; height: 768px; border-radius: 20px; border: 1px solid var(--line); background: #fff; overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow); }
.panel.show { animation: rise .45s both; }
.ph { height: 72px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 24px; border-bottom: 1px solid var(--line); }
.ph .ic { width: 38px; height: 38px; border-radius: 11px; background: var(--tint); color: var(--primary); display: grid; place-items: center; }
.ph .tt { font-size: 17px; font-weight: 700; letter-spacing: -.2px; }
.ph .ss { font-size: 12px; color: var(--muted); margin-top: 2px; }
.pill { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 600; padding: 5px 11px; border-radius: 999px; background: var(--green-tint); color: var(--green); white-space: nowrap; }
.pill i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: blink 1.4s infinite; }
.pill.amber { background: var(--amber-tint); color: var(--amber); }
.pill.orange { background: #fff1e6; color: #c25000; }
.pill.blue { background: var(--tint); color: var(--primary); }
.pb { flex: 1; padding: 22px 26px; overflow: hidden; position: relative; }
.waiting { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--sub); font-size: 13.5px; }
.waiting .sp { width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid var(--tint); border-top-color: var(--orange); animation: spin .9s linear infinite; }
.skel { width: 70%; height: 10px; border-radius: 5px; background: linear-gradient(90deg, #eef2f8 0, #f7f9fc 50%, #eef2f8 100%); background-size: 600px 10px; animation: shimmer 1.4s linear infinite; }
.sec { font-size: 10.5px; font-weight: 700; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; margin: 0 0 10px; display: flex; justify-content: space-between; }
.sec .r { color: var(--muted); font-weight: 600; }

.rows { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-bottom: 1px solid var(--line); background: #fff; animation: rise .45s both; }
.row:last-child { border-bottom: none; }
.row .d { width: 22px; height: 22px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; flex: none; }
.row .d svg { width: 12px; height: 12px; stroke-width: 3; }
.row .t { font-size: 13px; font-weight: 600; }
.row .s { font-size: 11.5px; color: var(--sub); margin-top: 1px; }
.row .v { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--green); white-space: nowrap; }
.row.wait .d { background: #f0b429; }
.row.wait .v { color: var(--amber); }
.row.info .d { background: var(--blue); }
.row.info .v { color: var(--primary); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 11.5px; font-weight: 500; padding: 5px 10px; border-radius: 999px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
.chip.green { background: var(--green-tint); border-color: #cdebd8; color: #0d6b35; }
.chip.orange { background: #fff4ec; border-color: #ffd9bd; color: #b34700; }
.chip.navy { background: var(--primary); border-color: var(--primary); color: #fff; }
.chip.new { animation: pop .4s .3s both; }
.card { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; background: #fff; }
.kv { display: grid; grid-template-columns: 112px 1fr; row-gap: 9px; column-gap: 12px; font-size: 13px; }
.kv .k { color: var(--muted); }
.kv .v { font-weight: 600; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.note { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: 12px; background: var(--bg); font-size: 12px; line-height: 1.55; color: #3b4352; }
.note svg { color: var(--primary); margin-top: 1px; }
.note b { color: var(--ink); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.big { font-size: 28px; font-weight: 700; letter-spacing: -.8px; color: var(--ink); font-variant-numeric: tabular-nums; }
.lbl { font-size: 11.5px; color: var(--muted); }
.avatar { border-radius: 14px; overflow: hidden; flex: none; background: var(--tint); }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo { border-radius: 14px; overflow: hidden; background: #e9edf3; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.bar2 { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar2 i { display: block; height: 100%; background: var(--green); border-radius: 3px; transform-origin: left; animation: grow .9s .2s both; }

/* modal over a panel (context stays behind it) */
.scrim { position: absolute; inset: 72px 0 0 0; background: rgba(243,245,249,.72); backdrop-filter: blur(3px); animation: fade .35s both; z-index: 4; }
.modal { position: absolute; left: 34px; right: 34px; top: 96px; bottom: 28px; background: #fff; border-radius: 18px; box-shadow: 0 30px 80px rgba(13,42,105,.22); border: 1px solid var(--line); z-index: 5; display: flex; flex-direction: column; overflow: hidden; animation: pop .45s .15s both; }
.modal .mh { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.modal .mh .tt { font-size: 15px; font-weight: 700; }
.modal .mh .ss { font-size: 11.5px; color: var(--muted); }
.modal .mb { flex: 1; display: grid; grid-template-columns: 1fr 300px; min-height: 0; }
.dealer { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); margin-bottom: 8px; transition: all .35s; background: #fff; }
.dealer .n { width: 26px; height: 26px; border-radius: 50%; background: var(--bg); color: var(--ink); display: grid; place-items: center; font-size: 11px; font-weight: 700; flex: none; transition: all .35s; }
.dealer .t { font-size: 13px; font-weight: 600; }
.dealer .s { font-size: 11.5px; color: var(--sub); }
.dealer .chip { margin-left: auto; }
.dealer.win { border-color: #9fd9b5; background: var(--green-tint); }
.dealer.win .n { background: var(--green); color: #fff; }
.dealer.gone { opacity: .5; }

/* ── WhatsApp ─────────────────────────────────────── */
.wa .status { background: #f7f7f7; }
.wa .hd { height: 58px; flex: none; background: #f7f7f7; color: #111; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid #e7e7e7; }
.wa .hd .lg { width: 36px; height: 36px; border-radius: 50%; background: #000; display: grid; place-items: center; }
.wa .hd .lg svg { height: 19px; width: auto; }
.wa .hd .n { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
.wa .hd .n img { width: 14px; height: 14px; }
.wa .hd .o { font-size: 11px; color: #667781; }
.wa .hd .ac { margin-left: auto; display: flex; gap: 18px; color: #1d8a4e; }
.wa .body { flex: 1; overflow-y: auto; padding: 10px 10px 6px; background: #efeae2; scrollbar-width: none; }
.wa .body::-webkit-scrollbar { display: none; }
.wa .foot { height: 56px; flex: none; background: #f7f7f7; display: flex; align-items: center; gap: 8px; padding: 0 12px 6px; }
.wa .foot .in2 { flex: 1; height: 34px; border-radius: 17px; background: #fff; border: 1px solid #e3e3e3; display: flex; align-items: center; padding: 0 14px; font-size: 12px; color: #9aa0a6; }
.div { text-align: center; margin: 10px 0 8px; }
.div span { font-size: 10px; font-weight: 600; letter-spacing: .6px; color: #54656f; background: #fff; padding: 4px 10px; border-radius: 7px; box-shadow: 0 1px 1px rgba(0,0,0,.05); }
.sysm { text-align: center; margin-bottom: 10px; }
.sysm span { display: inline-block; font-size: 10px; color: #6b5a12; background: #fdf4c5; padding: 5px 10px; border-radius: 7px; line-height: 1.4; }
.msg { display: flex; margin-bottom: 6px; }
.msg.u { justify-content: flex-end; }
.msg .b { max-width: 84%; background: #fff; border-radius: 8px; border-top-left-radius: 2px; padding: 7px 10px 5px; font-size: 12.8px; line-height: 1.45; white-space: pre-wrap; box-shadow: 0 1px .5px rgba(11,20,26,.13); color: #111b21; }
.msg.u .b { background: #d9fdd3; border-radius: 8px; border-top-right-radius: 2px; }
.msg .tm { display: block; text-align: right; font-size: 9.5px; color: #667781; margin-top: 2px; }
.msg.live { animation: rise .32s both; }
.typing .b { padding: 11px 14px; }
.typing .b span { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #8696a0; margin: 0 2px; animation: dots 1.1s infinite; }
.typing .b span:nth-child(2) { animation-delay: .15s; }
.typing .b span:nth-child(3) { animation-delay: .3s; }
.opts { display: flex; flex-direction: column; margin: 6px -10px -5px; border-top: 1px solid #eef0f1; }
.opts div { text-align: center; font-size: 12.5px; font-weight: 500; color: #027eb5; padding: 8px 0; border-bottom: 1px solid #eef0f1; transition: background .2s; }
.opts div:last-child { border-bottom: none; }
.opts div.pk { background: #eaf6fc; }
.opts div.tap { animation: tap .45s both; }
.wacard { margin: -4px -7px 7px; border-radius: 6px; overflow: hidden; }
.wacard img { width: 100%; height: 120px; object-fit: cover; display: block; }
.dlimg { width: 212px; display: block; border-radius: 6px; }
.locimg { width: 220px; height: 110px; border-radius: 6px; overflow: hidden; }

/* ── Instagram ─────────────────────────────────────── */
.ig .status { background: #fff; }
.ig .top { height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; font-size: 20px; font-weight: 700; font-family: 'Grand Hotel', 'Brush Script MT', cursive; }
.ig .post { flex: 1; overflow: hidden; }
.ig .ph2 { display: flex; align-items: center; gap: 9px; padding: 8px 12px; }
.ig .ph2 .lg { width: 32px; height: 32px; border-radius: 50%; background: #000; display: grid; place-items: center; box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px #e1306c; }
.ig .ph2 .lg svg { height: 16px; width: auto; }
.ig .media { position: relative; height: 360px; overflow: hidden; }
.ig .media img { width: 100%; height: 100%; object-fit: cover; animation: kenburns 6s ease-out both; }
.ig .cta { display: flex; justify-content: space-between; align-items: center; padding: 11px 12px; background: #f5f6f8; font-size: 13px; font-weight: 600; color: #111; border-bottom: 1px solid #eee; }
.ig .cta.press { animation: tap .5s 2.2s both; }
.ig .acts { display: flex; gap: 14px; padding: 10px 12px 4px; color: #111; }
.ig .cap { padding: 2px 12px; font-size: 12.5px; line-height: 1.45; color: #111; }

/* ── Renault website ───────────────────────────────── */
.br .status { background: #fff; }
.br .url { height: 40px; flex: none; display: flex; align-items: center; padding: 0 12px; background: #fff; }
.br .url div { flex: 1; height: 30px; border-radius: 10px; background: #f1f2f4; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 11.5px; color: #3c4043; }
.site-hd { height: 50px; flex: none; background: #000; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; color: #fff; }
.site-hd .w { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: 3.4px; font-size: 13px; }
.site-hd .w svg { height: 22px; width: auto; }
.site { flex: 1; overflow: hidden; position: relative; background: #fff; }
.hero { position: relative; height: 196px; overflow: hidden; color: #fff; }
.hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,0) 55%); }
.hero .t { position: absolute; left: 16px; top: 14px; z-index: 1; }
.hero .k { font-size: 10px; letter-spacing: 2px; font-weight: 600; opacity: .85; }
.hero .h { font-size: 22px; font-weight: 700; letter-spacing: 1.5px; margin-top: 2px; }
.form { padding: 12px 16px; }
.fl { font-size: 10.5px; font-weight: 600; color: #6b7280; letter-spacing: .6px; margin: 10px 0 6px; text-transform: uppercase; }
.seg { display: flex; gap: 6px; }
.seg div { flex: 1; text-align: center; font-size: 11.5px; font-weight: 500; padding: 8px 4px; border-radius: 8px; border: 1px solid #d9dde3; color: #374151; white-space: nowrap; }
.seg div.on { border-color: #000; background: #000; color: #fff; }
.seg div small { display: block; font-size: 9.5px; font-weight: 400; opacity: .7; }
.inp { height: 40px; border: 1px solid #d9dde3; border-radius: 8px; display: flex; align-items: center; padding: 0 12px; font-size: 13px; color: #111; gap: 8px; }
.inp .pre { color: #9aa0a6; }
.inp .tick { margin-left: auto; color: var(--green); }
.typed { display: inline-block; overflow: hidden; white-space: nowrap; vertical-align: bottom; width: 0; animation: typeIn var(--dur, 1s) steps(var(--n, 12)) var(--d, 0s) forwards; }
.cons { display: flex; gap: 8px; font-size: 10.5px; color: #4b5563; line-height: 1.4; margin-top: 10px; }
.cons .bx { width: 15px; height: 15px; border-radius: 4px; background: #000; color: #fff; display: grid; place-items: center; flex: none; }
.cons .bx svg { width: 10px; height: 10px; stroke-width: 3; }
.rcta { margin-top: 12px; height: 46px; border-radius: 999px; background: #000; color: #fff; font-weight: 600; font-size: 13.5px; display: grid; place-items: center; letter-spacing: .3px; }
.rcta.press { animation: tap .5s both; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 20px 20px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,.2); padding: 20px 18px 26px; animation: rise .45s both; }
.dim { position: absolute; inset: 0; background: rgba(10,12,16,.4); animation: fade .3s both; }
.otp { display: flex; gap: 8px; margin: 14px 0 10px; }
.otp div { flex: 1; height: 48px; border: 1px solid #d9dde3; border-radius: 10px; display: grid; place-items: center; font-size: 20px; font-weight: 600; }

/* ── dealer app ────────────────────────────────────── */
.dl .status { background: var(--navy); color: #fff; }
.dl .hd { flex: none; background: var(--navy); color: #fff; padding: 4px 18px 16px; }
.dl .hd .a { display: flex; align-items: center; gap: 10px; }
.dl .hd .a img { width: 28px; height: 28px; border-radius: 8px; background: #fff; padding: 4px; }
.dl .hd .n { font-size: 14px; font-weight: 600; }
.dl .hd .o { font-size: 11px; color: #b9c8e8; }
.dl .bd { flex: 1; background: #f5f7fb; padding: 14px; overflow: hidden; }
.lead { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 8px 24px rgba(13,42,105,.1); animation: pop .45s both; }
.lead .tp { background: var(--orange); color: #fff; padding: 9px 14px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 700; letter-spacing: .8px; transition: background .4s; }
.lead .in3 { padding: 14px; }
.grade { width: 42px; height: 42px; border-radius: 12px; background: var(--green); color: #fff; display: grid; place-items: center; font-size: 20px; font-weight: 800; flex: none; }
.btn { height: 46px; border-radius: 12px; display: grid; place-items: center; font-weight: 600; font-size: 13.5px; transition: background .3s; }
.btn.or { background: var(--orange); color: #fff; }
.btn.dark { background: var(--primary); color: #fff; }
.btn.ghost { border: 1px solid #d9dde3; color: #374151; }
.btn.green { background: var(--green); color: #fff; }
.btn.press { animation: tap .5s both; }
.opt { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; border: 1px solid #e1e5ec; background: #fff; margin-bottom: 7px; }
.opt.on { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary) inset; }
.opt .rd { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #c3c8cf; flex: none; }
.opt.on .rd { border: 5px solid var(--primary); }

/* ── call screen ───────────────────────────────────── */
.call { background: radial-gradient(120% 80% at 50% 0%, #1d2a44 0%, #070b14 70%); color: #fff; }
.call .status { color: #fff; }

/* ── analytics ─────────────────────────────────────── */
.dash { position: absolute; inset: 0; display: grid; grid-template-columns: 196px 1fr; }
.side { background: #070b14; color: #9aa6bd; padding: 20px 0; display: flex; flex-direction: column; }
.side .lg { padding: 0 18px 20px; }
.side .lg img { height: 17px; filter: brightness(0) invert(1); }
.side a { display: flex; align-items: center; gap: 10px; padding: 10px 18px; font-size: 12.5px; color: inherit; text-decoration: none; }
.side a.on { background: rgba(255,255,255,.07); color: #fff; box-shadow: inset 2px 0 0 var(--orange); }
.mainp { padding: 22px 26px; overflow: hidden; background: #f6f8fb; }
.kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.kpi { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.kpi .v { font-size: 24px; font-weight: 700; letter-spacing: -.6px; color: var(--ink); font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 11.5px; color: var(--sub); margin-top: 2px; }
.kpi .d { font-size: 11px; color: var(--green); font-weight: 600; margin-top: 6px; }
.funnel .rw { display: grid; grid-template-columns: 168px 1fr 104px; align-items: center; gap: 12px; margin-bottom: 9px; font-size: 12px; }
.funnel .rw .b { height: 20px; background: #eef1f6; border-radius: 0 6px 6px 0; position: relative; }
.funnel .rw .b i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--primary); border-radius: 0 6px 6px 0; transform-origin: left; animation: grow .9s both; }
.funnel .rw .b i.hi { background: var(--orange); }
.funnel .rw .n { font-weight: 600; color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
.funnel .rw .n small { color: var(--muted); font-weight: 500; margin-left: 4px; }
table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.t th { text-align: left; font-size: 10px; letter-spacing: 1.2px; color: var(--muted); font-weight: 600; text-transform: uppercase; padding: 0 8px 8px; border-bottom: 1px solid var(--line); }
table.t td { padding: 9px 8px; border-bottom: 1px solid #f0f2f6; font-variant-numeric: tabular-nums; }
table.t td.r, table.t th.r { text-align: right; }
table.t tr:hover td { background: #fafbfd; }
#tip { position: fixed; z-index: 99; pointer-events: none; background: #070b14; color: #fff; font-size: 11.5px; padding: 6px 9px; border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.25); opacity: 0; transition: opacity .12s; max-width: 260px; }

@media (max-width: 900px) {
  body { overflow: auto; }
  .app { grid-template-columns: 1fr; height: auto; min-height: 100vh; }
  .rail { display: none; }
  .stage { height: 62vw; flex: none; }
  .bar { grid-template-columns: auto 1fr auto; }
  .prog, .lockup { display: none; }
}
</style>

  let gen = 0;

  const scrollChat = () => { const b = $$('#wabody'); if (b) b.scrollTo({ top: b.scrollHeight, behavior: 'smooth' }); };
  const revealPanel = (s) => { const p = $$('#panel'); if (p) p.outerHTML = s.panel(); };

  async function playChat(s) {
    const g = gen;
    const body = $$('#wabody');
    const state = $$('#wastate');
    const [start, end] = s.wa;
    if (s.panelAt !== undefined && s.panelAt < start) revealPanel(s);
    try {
      await sleep(500, g);
      for (let i = start; i < end; i++) {
        const m = WA[i];
        if (m.div || m.sys) {
          body.insertAdjacentHTML('beforeend', msgHTML(m, i, -1, true));

          body.insertAdjacentHTML('beforeend', msgHTML(m, i, -1, true));

          await sleep(300, g);

          scrollChat();
          await sleep(650 + Math.min(strip(m.bot).length * 7, 1300), g);
          $$('#typing')?.remove();
          state.textContent = 'online';

          scrollChat();
          await sleep(350, g);
        }
        if (i === s.panelAt) revealPanel(s);
      }
      state.textContent = 'Business account';
      nudge();
    } catch (e) { if (e !== 'stale') console.error(e); }
  }

    if (s.panel && s.panelDelay > 0) later(s.panelDelay, () => revealPanel(s));
    else if (s.panel) revealPanel(s);
    if (s.live === 'race') {
      let left = 14 * 60 + 59, t = 0;
      const g = gen;
      const tick = setInterval(() => {
        if (g !== gen) return clearInterval(tick);
        left -= 1; t += 1;
        const cd = $$('#cd'); if (cd && left > 0 && t <= 108) cd.textContent = `${String(Math.floor(left / 60)).padStart(2, '0')}:${String(left % 60).padStart(2, '0')} left`;
        const race = $$('#race'); if (race && t <= 108) race.textContent = `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
      }, 32);
      later(1400, () => { const r = $$('#dl-pb .chip'); if (r) r.textContent = 'Viewing'; });
      later(2000, () => { const r = $$('#dl-jp .chip'); if (r) r.textContent = 'Viewing'; const k = $$('#dl-kn .chip'); if (k) k.textContent = 'Viewing'; });
      later(3300, () => { const a = $$('#accept'); if (a) a.classList.add('press'); });
      later(3800, () => {
        const a = $$('#accept'), tp = $$('#leadtp'), pass = $$('#pass');
        if (a) { a.className = 'btn green'; a.textContent = 'Accepted · the lead is yours'; }
        if (pass) pass.style.visibility = 'hidden';
        if (tp) { tp.style.background = '#129a4a'; tp.innerHTML = '<span>YOU WON THIS LEAD</span><span class="mono">1 m 48 s</span>'; }
        const k = $$('#dl-kn');
        if (k) { k.classList.add('win'); k.querySelector('.chip').className = 'chip green'; k.querySelector('.chip').textContent = 'Accepted'; k.querySelector('.s').textContent = 'Arjun Menon accepted in 1 m 48 s'; }
        const ln = $$('#ln-kn'); if (ln) { ln.setAttribute('stroke', '#129a4a'); ln.setAttribute('stroke-dasharray', '0'); ln.setAttribute('stroke-width', '3.5'); }
        const pg = $$('#pg-kn'); if (pg) pg.setAttribute('fill', '#129a4a');
        const mp = $$('#mpill'); if (mp) mp.innerHTML = pillH('Accepted · Kirti Nagar');
      });
      later(4700, () => {
        ['pb', 'jp'].forEach((id) => { const r = $$(`#dl-${id}`); if (r) { r.classList.add('gone'); r.querySelector('.chip').className = 'chip'; r.querySelector('.chip').textContent = 'Closed'; } const ln = $$(`#ln-${id}`); if (ln) ln.setAttribute('opacity', '.15'); const pg = $$(`#pg-${id}`); if (pg) pg.setAttribute('opacity', '0'); });
        nudge();
      });
    }
    if (s.live === 'call') {
      let t = 0;
      const g = gen;
      const tick = setInterval(() => {
        if (g !== gen) return clearInterval(tick);
        t = Math.min(t + 1, 52);
        const el = $$('#calltime'); if (el) el.textContent = `00:${String(t).padStart(2, '0')}`;
      }, 190);
      later(9800, nudge);
    }
    if (!s.wa && !s.live) later(s.panelDelay ? s.panelDelay + 1800 : 2800, nudge);
  }
  function nudge() { $('#next')?.classList.add('pulse'); }

  // ───────────────────────────── render ─────────────────────────────
  const canvas = $('#canvas');
  const KEY = 'renault-td-v3';
  let idx = 0;
  try { const h = parseInt((location.hash.match(/\d+/) || [])[0], 10); idx = h ? h - 1 : parseInt(localStorage.getItem(KEY) || '0', 10) || 0; } catch (e) {}
  idx = Math.min(Math.max(0, idx), STEPS.length - 1);

  function slideHTML(s) {
    if (s.render) return s.render();
    const phone = s.wa ? waPhone(s.wa[0]) : s.split();
    const panel = s.wait ? waitPanel(...s.wait) : '<div class="panel" id="panel"></div>';
    return `<div class="split">${phone}${panel}</div>`;
  }

  function draw(prev) {
    gen++;
    const s = STEPS[idx];
    canvas.querySelectorAll('.slide:not(.leave)').forEach((old) => { old.classList.add('leave'); setTimeout(() => old.remove(), 250); });
    const el = document.createElement('div');
    el.className = 'slide enter';
    el.innerHTML = slideHTML(s);
    canvas.appendChild(el);
    cur = el;
    const wb = el.querySelector('#wabody');
    if (wb) wb.scrollTop = wb.scrollHeight;
    if (prev !== undefined && prev < idx && STEPS[prev].c !== s.c && CH[s.c].banner) {
      const b = document.createElement('div');
      b.className = 'banner';
      b.innerHTML = `<b>STAGE ${CH[s.c].n} · ${CH[s.c].t.toUpperCase()}</b>${CH[s.c].banner}`;
      $('#stage').appendChild(b);
      setTimeout(() => b.remove(), 3500);
    }
    $('#head').innerHTML = `<div class="hx"><div class="eb">${s.c >= 1 && s.c <= 4 ? `<b>Stage ${CH[s.c].n}</b> · ${CH[s.c].t} · ` : `<b>${CH[s.c].t}</b> · `}${s.eb}</div><h1>${s.h}</h1><p>${s.p}</p></div>`;
    renderRail();
    $('#prev').disabled = idx === 0;
    const nx = $('#next');
    nx.disabled = idx === STEPS.length - 1;
    nx.classList.remove('pulse');
    $('#upnext').innerHTML = idx < STEPS.length - 1 ? `Up next<b>${STEPS[idx + 1].label}</b>` : '';
    document.querySelectorAll('#prog button').forEach((b) => { const k = +b.dataset.c; b.className = k === s.c ? 'on' : k < s.c ? 'done' : ''; });
    $('#count').innerHTML = `<b>${idx + 1}</b> of ${STEPS.length}`;
    try { localStorage.setItem(KEY, String(idx)); history.replaceState(null, '', `#${idx + 1}`); } catch (e) {}
    runLive(s);
  }

  function renderRail() {
    const s = STEPS[idx];
    $('#chapters').innerHTML = CH.map((c, k) => {
      const first = STEPS.findIndex((x) => x.c === k);
      const list = k === s.c ? `<div class="steps">${STEPS.map((x, i) => (x.c === k ? `<div data-i="${i}" class="${i === idx ? 'cur' : i < idx ? 'past' : ''}"><i></i>${x.label}</div>` : '')).join('')}</div>` : '';
      return `<div class="chap ${k === s.c ? 'on' : k < s.c ? 'done' : ''}" data-i="${first}"><div class="n">${k < s.c ? ic('check', 12, 'stroke-width:3') : c.n}</div><div class="t">${c.t}</div>${list}</div>`;
    }).join('');
    $('#chapters').querySelectorAll('[data-i]').forEach((e) => e.addEventListener('click', (ev) => { ev.stopPropagation(); go(+e.dataset.i); }));
  }

  function go(i) { const n = Math.min(Math.max(0, i), STEPS.length - 1); if (n === idx) return; const p = idx; idx = n; draw(p); }

  $('#prog').innerHTML = CH.slice(1, 5).map((c, k) => `${k ? '<span class="sep"></span>' : ''}<button data-c="${k + 1}"><i></i>${c.t.replace(' & AI calling', '')}</button>`).join('');
  $('#prog').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => go(STEPS.findIndex((x) => x.c === +b.dataset.c))));
  $('#prev').addEventListener('click', () => go(idx - 1));
  $('#next').addEventListener('click', () => go(idx + 1));
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { go(idx + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { go(idx - 1); e.preventDefault(); }
    else if (e.key === 'Home') go(0);
    else if (e.key === 'End') go(STEPS.length - 1);
  });

  function fit() {
    const st = $('#stage');
    const k = Math.min(st.clientWidth / 1280, st.clientHeight / 800);
    const w = 1280 * k, h = 800 * k;
    const fr = $('#frame');
    fr.style.width = `${w}px`; fr.style.height = `${h}px`;
    fr.style.left = `${(st.clientWidth - w) / 2}px`; fr.style.top = `${(st.clientHeight - h) / 2}px`;
    canvas.style.transform = `scale(${k})`;
  }
  window.addEventListener('resize', fit);

  const tip = $('#tip');
  document.addEventListener('mousemove', (e) => {
    const t = e.target.closest && e.target.closest('[data-tip]');
    if (!t) { tip.style.opacity = 0; return; }
    tip.textContent = t.dataset.tip; tip.style.opacity = 1;
    tip.style.left = `${e.clientX + 14}px`; tip.style.top = `${e.clientY + 14}px`;
  });

  fit();
  draw();
})();
</script>
</body>
</html>
